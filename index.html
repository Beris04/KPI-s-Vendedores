<style>
:root{--navy:#06345d;--navy2:#052844;--blue:#145da6;--blue2:#1c78c0;--cyan:#37a3ff;--sky:#eaf4ff;--line:#d7e5f2;--bg:#f3f7fb;--card:#fff;--text:#142033;--muted:#64748b;--green:#059669;--amber:#d97706;--red:#b42318;--purple:#6d5dfc;--shadow:0 10px 30px rgba(12,45,82,.10);--r:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;font-size:14px}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 10%,#2887d8 0,#0d58a0 25%,#062846 72%);padding:24px;position:relative;overflow:hidden}.login:before{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.12) 42%,transparent 57%);transform:rotate(-8deg)}.login-card{width:min(460px,94vw);background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.55);border-radius:30px;padding:32px;box-shadow:0 30px 90px rgba(0,0,0,.32);position:relative}.brand{display:flex;gap:16px;align-items:center;margin-bottom:22px}.logo{width:60px;height:60px;border-radius:18px;background:#165aa3;display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 26px rgba(20,93,166,.24)}.logo img{width:100%;height:100%;object-fit:cover}.brand h1{margin:0;color:var(--navy);font-size:25px;letter-spacing:.2px}.brand p{margin:4px 0 0;color:var(--muted)}label{font-weight:900;color:#344054;display:block;margin:16px 0 7px}input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:white;color:var(--text);font-size:14px}input{width:100%}.btn{border:0;background:linear-gradient(135deg,var(--blue),var(--navy));color:white;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer;box-shadow:0 5px 14px rgba(11,56,97,.16)}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:white;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.small{font-size:12px;padding:6px 9px;border-radius:9px}.layout{display:grid;grid-template-columns:286px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#07345c 0%,#0b4f8e 58%,#083764 100%);color:white;padding:18px 14px;position:sticky;top:0;height:100vh;box-shadow:9px 0 34px rgba(5,40,68,.22);border-right:1px solid rgba(255,255,255,.12)}.side-brand{display:flex;align-items:center;gap:13px;padding:8px 8px 22px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:12px}.side-brand .logo{width:54px;height:54px;border-radius:15px;background:#165aa3;box-shadow:none}.side-title{font-weight:950;color:white;letter-spacing:.3px}.side-sub{font-size:12px;color:#cde6fa}.nav button{width:100%;border:0;background:rgba(255,255,255,.05);text-align:left;border-radius:14px;padding:12px 13px;margin:6px 0;color:#e8f4ff;font-weight:900;cursor:pointer;border:1px solid transparent}.nav button.active,.nav button:hover{background:white;color:var(--navy);border-color:rgba(255,255,255,.55);box-shadow:0 10px 24px rgba(0,0,0,.14)}.footer{font-size:12px;color:#d5e9fb;margin-top:18px;line-height:1.55;border-top:1px solid rgba(255,255,255,.14);padding-top:14px}.content{padding:22px 28px 42px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;background:white;border:1px solid var(--line);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow)}.title h2{margin:0;color:var(--navy);font-size:27px}.title p{margin:5px 0 0;color:var(--muted)}.period{background:linear-gradient(135deg,#f8fbff,#eaf4ff);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:900;color:var(--navy);white-space:nowrap;display:flex;align-items:center;gap:8px}.period select{width:auto;min-width:230px;font-weight:900;border-color:#b9d4ea}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px;margin-bottom:16px}.card{background:white;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--blue),var(--cyan))}.card span{display:block;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}.card b{display:block;color:var(--navy);font-size:26px;margin-top:7px}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow);margin-bottom:16px}.panel h3{margin:0 0 13px;color:var(--navy);font-size:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{width:280px}.table-wrap{border:1px solid var(--line);border-radius:16px;overflow:auto;background:white}.table-wrap.scroll{max-height:445px}.dashboard-table{overflow:visible}.dashboard-table table{table-layout:fixed;min-width:0}.dashboard-table th,.dashboard-table td{font-size:13px;padding:11px 8px}.dashboard-table .num{font-size:15px;font-weight:900}table{width:100%;border-collapse:separate;border-spacing:0;min-width:780px}th{background:var(--navy);color:#fff;text-align:left;font-size:13px;padding:11px 10px;position:sticky;top:0;z-index:1;border-right:1px solid rgba(255,255,255,.16)}th:first-child{border-top-left-radius:12px}th:last-child{border-top-right-radius:12px}td{padding:12px 10px;border-bottom:1px solid #edf2f7;border-right:1px solid #f1f5f9;vertical-align:top}tr:hover td{background:#f7fbff}.num{text-align:right;font-variant-numeric:tabular-nums}.big-num{font-size:20px;font-weight:950;color:var(--navy)}.rank{font-size:20px;font-weight:950;color:var(--navy)}.ok{color:var(--green);font-weight:950}.mid{color:var(--amber);font-weight:950}.bad{color:var(--red);font-weight:950}.bar-chart{display:flex;flex-direction:column;gap:9px}.bar-row{display:grid;grid-template-columns:210px 1fr 110px;gap:12px;align-items:center;cursor:pointer;padding:6px;border-radius:12px}.bar-row:hover{background:#f3f8fd}.bar-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar-track{height:23px;background:#e8eff7;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}.bar-fill{height:100%;background:linear-gradient(90deg,#0b4f8e,#25a0ff);border-radius:99px}.bar-val{text-align:right;color:var(--navy);font-weight:950}.bar-row.active .bar-track{outline:3px solid #9ed0f4}.vendor-box{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.info{background:linear-gradient(135deg,#f8fbff,#edf7ff);border:1px solid var(--line);border-radius:15px;padding:13px}.info span{display:block;color:var(--muted);font-size:12px;font-weight:900}.info b{display:block;font-size:20px;color:var(--navy);margin-top:5px}.note{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:14px;padding:11px;margin:10px 0}.pill{display:inline-flex;align-items:center;background:#eaf3fb;color:var(--navy);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:950}.editable{width:170px;text-align:right}.load-ok{background:#ecfdf3;border:1px solid #a7f3d0;color:#065f46;padding:10px;border-radius:12px;margin-top:10px}.load-warn{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;padding:10px;border-radius:12px;margin-top:10px}.select{min-width:240px}.mini-help{font-size:12px;color:var(--muted);font-weight:700;margin-top:8px}@media(max-width:1180px){.layout{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.grid-2,.grid-3{grid-template-columns:1fr}.dashboard-table{overflow:auto}.vendor-box{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.content{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.nav{grid-template-columns:1fr}.bar-row{grid-template-columns:1fr}.bar-val{text-align:left}.vendor-box{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.period{white-space:normal;flex-direction:column;align-items:flex-start}.period select{min-width:100%;width:100%}}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="login-card">
    <div class="brand"><div class="logo"><img src="toyo_logo.png" alt="Toyo Foods"></div><div><h1>TOYO FOODS</h1><p>Ranking Ejecutivo de Vendedores GDL</p></div></div>
    <label>Usuario</label><input id="loginUser" value="Toyo" autocomplete="username">
    <label>Contraseña</label><input id="loginPass" type="password" value="Toyo2026" autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:20px" onclick="login()">Entrar</button>
    <div id="loadState" class="load-warn hidden">No se cargó data.js. Extrae todo el ZIP antes de abrir el index.html.</div>
    <p id="loginMsg" style="color:#b42318;font-weight:800"></p>
  </div>
</section>
<div id="app" class="layout hidden">
  <aside class="sidebar">
    <div class="side-brand"><div class="logo"><img src="toyo_logo.png" alt="Toyo Foods"></div><div><div class="side-title">TOYO FOODS</div><div class="side-sub">Ranking Vendedores GDL</div></div></div>
    <nav id="nav" class="nav"></nav>
    <div class="footer">Usuario: <b>Toyo</b><br>Contraseña: <b>Toyo2026</b><br><br>Versión Power BI: v5<br>Metas protegidas</div>
  </aside>
  <main class="content">
    <div class="topbar"><div class="title"><h2 id="pageTitle">Dashboard</h2><p id="pageSub">Vista ejecutiva del periodo</p></div><div id="period" class="period"></div></div>
    <section id="view"></section>
  </main>
</div>
<script src="data.js"></script>
<script>
'use strict';
let PERIODS = window.RANKING_PERIODS || (window.RANKING_DATA ? {[window.RANKING_DATA.periodo || 'Periodo cargado']: window.RANKING_DATA} : {});
let DATA = window.RANKING_DATA || Object.values(PERIODS)[0] || null;
let selectedVendor = '';
let currentView = 'dashboard';
const NAV = [
  ['dashboard','Dashboard','Ranking general y KPIs'], ['meta','Meta de Ventas','Avance contra meta'], ['visitas','Visitas de clientes','Resumen y detalle de visitas'], ['categorias','Incremento y Recuperación','Categorías por cliente y vendedor'], ['prospectos','Prospección y Clientes','Nuevos y recuperados'], ['cartera','Cartera Vencida','Deuda por vendedor'], ['giro','Giro de Clientes','Venta y cobertura por giro'], ['config','Configuración','Carga de alimentador y metas']
];
function $(id){return document.getElementById(id)}
function esc(v){return String(v ?? '').replace(/[&<>'"]/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]))}
function money(v){return '$'+Number(v||0).toLocaleString('es-MX',{maximumFractionDigits:0})}
function pct(v){return (Number(v||0)*100).toLocaleString('es-MX',{maximumFractionDigits:1})+'%'}
function num(v){return Number(v||0).toLocaleString('es-MX')}
function fmt(k,v){let key=String(k).toLowerCase(); if(key.includes('%')||key.includes('avance')||key.includes('participación')||key.includes('score')) return pct(v); if(key.includes('venta')||key.includes('meta')||key.includes('faltante')||key.includes('deuda')||key.includes('histórica')||key.includes('colocada')||key.includes('cartera')) return money(v); if(typeof v==='number') return num(v); return esc(v)}
function metaStorageKey(){return 'toyo.ranking.metas'}
function getCurrentMetaMap(){try{let saved=JSON.parse(localStorage.getItem(metaStorageKey())||'{}'); if(Object.keys(saved).length) return saved;}catch(e){} let rows=(DATA&&DATA.metasConfig)||[]; return Object.fromEntries(rows.map(r=>[r.Vendedor,Number(r.Meta||0)]));}
function saveMetaMap(map){try{localStorage.setItem(metaStorageKey(),JSON.stringify(map));}catch(e){}}
function applyMetaMapToDataset(d,map){if(!d||!map||!Object.keys(map).length)return d; d.metasConfig=(d.metasConfig||[]).map(r=>({...r,Meta:Number(map[r.Vendedor]??r.Meta??0)})); d.metaVentas=(d.metaVentas||[]).map(r=>{let meta=Number(map[r.Vendedor]??r.Meta??0),venta=Number(r['Venta real']||0);return {...r,Meta:meta,'Avance %':meta?venta/meta:0,'Faltante monto':Math.max(meta-venta,0)}}); let m=Object.fromEntries((d.metaVentas||[]).map(r=>[r.Vendedor,r])); d.dashboard=(d.dashboard||[]).map(r=>({...r,Meta:m[r.Vendedor]?.Meta??r.Meta,'Avance venta %':m[r.Vendedor]?.['Avance %']??r['Avance venta %']})); d.cards=d.cards||{}; d.cards['Meta total']=(d.metaVentas||[]).reduce((s,r)=>s+Number(r.Meta||0),0); d.cards['Venta total']=(d.metaVentas||[]).reduce((s,r)=>s+Number(r['Venta real']||0),0)||d.cards['Venta total']||0; d.cards['Avance venta %']=d.cards['Meta total']?d.cards['Venta total']/d.cards['Meta total']:0; return d;}
function applySavedMetasToAll(){let map=getCurrentMetaMap(); Object.keys(PERIODS).forEach(k=>applyMetaMapToDataset(PERIODS[k],map)); if(DATA) applyMetaMapToDataset(DATA,map)}
function periodKeys(){return Object.keys(PERIODS)}
function periodShort(k){return String(k).replace(' · corte al ',' / corte ')}
function renderPeriodControl(){let keys=periodKeys(); $('period').innerHTML=`<span>Mes:</span><select id="periodSelect" onchange="switchPeriod(this.value)">${keys.map(k=>`<option value="${esc(k)}" ${DATA&&DATA.periodo===k?'selected':''}>${esc(periodShort(k))}</option>`).join('')}</select>`;}
function switchPeriod(k){if(!PERIODS[k])return; DATA=applyMetaMapToDataset(PERIODS[k],getCurrentMetaMap()); selectedVendor=DATA.dashboard?.[0]?.Vendedor||''; renderPeriodControl(); show(currentView||'dashboard');}

function clsPct(v){v=Number(v||0); return v>=1?'ok':v>=.8?'mid':'bad'}
function csvEscape(v){let s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function downloadCSV(name, rows){rows=rows||[]; if(!rows.length){alert('No hay datos para exportar'); return} let cols=Object.keys(rows[0]); let csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>csvEscape(r[c])).join(','))).join('\n'); let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href)}
function table(rows,opt={}){rows=rows||[]; let cols=opt.cols || (rows[0]?Object.keys(rows[0]):[]); let cls='table-wrap '+(opt.scroll?'scroll ':'')+(opt.dashboard?'dashboard-table ':''); if(!rows.length) return '<div class="note">Sin información para mostrar.</div>'; return `<div class="${cls}"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${typeof r[c]==='number'?'num':''}">${fmt(c,r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function searchRows(rows,q){q=String(q||'').trim().toUpperCase(); if(!q)return rows; return rows.filter(r=>Object.values(r).join(' ').toUpperCase().includes(q))}
function bars(rows,label,value,opt={}){rows=(rows||[]).filter(r=>Number(r[value]||0)>0); let max=Math.max(...rows.map(r=>Number(r[value]||0)),1); return `<div class="bar-chart">${rows.map(r=>{let val=Number(r[value]||0);let w=Math.max(2,val/max*100);let active=(r.Vendedor&&r.Vendedor===selectedVendor)?'active':'';let click=r.Vendedor?`onclick="selectVendor('${esc(r.Vendedor)}')"`:'';return `<div class="bar-row ${active}" ${click}><div class="bar-name" title="${esc(r[label])}">${esc(r[label])}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div><div class="bar-val">${opt.pct?pct(val):opt.money?money(val):num(val)}</div></div>`}).join('')}</div>`}
function cards(){let c=DATA.cards||{}; return `<div class="cards"><div class="card"><span>Venta total</span><b>${money(c['Venta total'])}</b></div><div class="card"><span>Meta total</span><b>${money(c['Meta total'])}</b></div><div class="card"><span>Avance venta</span><b class="${clsPct(c['Avance venta %'])}">${pct(c['Avance venta %'])}</b></div><div class="card"><span>Visitas</span><b>${num(c.Visitas)}</b></div><div class="card"><span>Colocación categoría</span><b>${money(c['Colocación categoría'])}</b></div><div class="card"><span>Cartera vencida</span><b>${money(c['Cartera vencida'])}</b></div></div>`}
function vendorInfo(v){let r=(DATA.dashboard||[]).find(x=>x.Vendedor===v) || (DATA.dashboard||[])[0]; if(!r)return ''; selectedVendor=r.Vendedor; return `<div class="panel"><div class="panel-head"><h3>Detalle vendedor seleccionado</h3><span class="pill">${esc(r.Vendedor)}</span></div><div class="vendor-box"><div class="info"><span>Ranking</span><b>#${r.Rank}</b></div><div class="info"><span>Venta</span><b>${money(r['Venta real'])}</b></div><div class="info"><span>Avance venta</span><b class="${clsPct(r['Avance venta %'])}">${pct(r['Avance venta %'])}</b></div><div class="info"><span>Visitas</span><b>${num(r.Visitas)}</b></div><div class="info"><span>Cartera</span><b>${money(r['Cartera vencida'])}</b></div></div></div>`}
function selectVendor(v){selectedVendor=v; renderDashboard()}
function login(){if(!DATA){$('loadState').classList.remove('hidden'); return} let u=$('loginUser').value.trim(),p=$('loginPass').value.trim(); if(u==='Toyo'&&p==='Toyo2026'){$('login').classList.add('hidden');$('app').classList.remove('hidden');initApp()} else $('loginMsg').textContent='Usuario o contraseña incorrectos'}
function initApp(){applySavedMetasToAll(); selectedVendor=DATA.dashboard?.[0]?.Vendedor || ''; renderPeriodControl(); $('nav').innerHTML=NAV.map(([id,name])=>`<button id="nav-${id}" onclick="show('${id}')">${name}</button>`).join(''); show('dashboard')}
function show(id){currentView=id; NAV.forEach(([x])=>$('nav-'+x)?.classList.toggle('active',x===id)); let item=NAV.find(x=>x[0]===id); $('pageTitle').textContent=item[1]; $('pageSub').textContent=item[2]; renderPeriodControl(); ({dashboard:renderDashboard,meta:renderMeta,visitas:renderVisitas,categorias:renderCategorias,prospectos:renderProspectos,cartera:renderCartera,giro:renderGiro,config:renderConfig}[id])()}
function renderDashboard(){let rows=(DATA.dashboard||[]).slice().sort((a,b)=>a.Rank-b.Rank); $('view').innerHTML=cards()+vendorInfo(selectedVendor)+`<div class="grid-2"><div class="panel"><h3>Ranking interactivo por score</h3><div class="note">Da click en un vendedor para ver su información resumida.</div>${bars(rows,'Vendedor','Score',{pct:true})}</div><div class="panel"><h3>Avance de venta por vendedor</h3>${bars(rows.map(r=>({...r,Avance:r['Avance venta %']})),'Vendedor','Avance',{pct:true})}</div></div><div class="panel"><div class="panel-head"><h3>Tabulador ranking KPI</h3><button class="btn small secondary" onclick='downloadCSV("dashboard_ranking.csv",DATA.dashboard)'>CSV</button></div>${table(rows,{dashboard:true,cols:['Rank','Vendedor','Venta real','Meta','Avance venta %','Visitas','Avance visitas %','Venta colocación categoría','Clientes nuevos','Clientes recuperados','Cartera vencida','Score']})}</div>`}
function renderMeta(){let rows=DATA.metaVentas||[]; $('view').innerHTML=`<div class="grid-2"><div class="panel"><h3>Avance en porcentaje</h3>${bars(rows.map(r=>({...r,Avance:r['Avance %']})),'Vendedor','Avance',{pct:true})}</div><div class="panel"><h3>Faltante por vendedor</h3>${bars(rows,'Vendedor','Faltante monto',{money:true})}</div></div><div class="panel"><div class="panel-head"><h3>Meta de Ventas</h3><button class="btn small secondary" onclick='downloadCSV("meta_ventas.csv",DATA.metaVentas)'>CSV</button></div>${table(rows,{cols:['Vendedor','Meta','Venta real','Avance %','Faltante monto']})}</div>`}
function renderVisitas(){let rows=DATA.visitasResumen||[]; $('view').innerHTML=`<div class="panel"><div class="panel-head"><h3>Resumen de visitas</h3><button class="btn small secondary" onclick='downloadCSV("visitas_resumen.csv",DATA.visitasResumen)'>CSV</button></div>${table(rows,{cols:['Vendedor','Visitas en el mes','Avance %','Meta mensual','Clientes únicos']})}</div><div class="grid-2"><div class="panel"><h3>Visitas por vendedor</h3>${bars(rows,'Vendedor','Visitas en el mes')}</div><div class="panel"><h3>Tipos de visitas más generadas</h3>${bars(DATA.visitaTipos||[],'Tipo de visita','Visitas')}</div></div><div class="panel"><div class="panel-head"><h3>Detalle de visitas cargadas</h3><div class="toolbar"><input class="search" id="visSearch" placeholder="Buscar vendedor, cliente o tipo..." oninput="filterVisitas()"><button class="btn small secondary" onclick='downloadCSV("visitas_detalle.csv",searchRows(DATA.visitasDetalle,$("visSearch").value))'>CSV</button></div></div><div id="visTable"></div></div>`; filterVisitas()}
function filterVisitas(){let rows=searchRows(DATA.visitasDetalle||[],$('visSearch')?.value); $('visTable').innerHTML=table(rows,{scroll:true,cols:['Fecha','Vendedor','Nombre Excel','Cliente','Tipo de visita','Ciudad','Duración min']})}
function vendorSelect(id,onchange){return `<select id="${id}" onchange="${onchange}" class="select"><option value="">Todos los vendedores</option>${(DATA.officialVendors||[]).map(v=>`<option value="${esc(v)}" ${v===selectedVendor?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function renderCategorias(){let v=$('catVendor')?.value ?? selectedVendor; selectedVendor=v; let detail=(DATA.categoriaDetalle||[]).filter(r=>!v||r.Vendedor===v); let coloc=(DATA.colocacionCliente||[]).filter(r=>!v||r.Vendedor===v); $('view').innerHTML=`<div class="panel"><div class="panel-head"><h3>Análisis de recuperación e incremento</h3><div class="toolbar">${vendorSelect('catVendor','renderCategorias()')}<button class="btn small secondary" onclick="selectedVendor='';renderCategorias()">Todos</button></div></div><div class="note"><b>Recuperación:</b> categorías que el cliente ya compraba y dejó de comprar en el mes actual. <b>Incremento/colocación:</b> categoría que antes no compraba y ahora sí compró, con producto de referencia.</div></div><div class="grid-2"><div class="panel"><div class="panel-head"><h3>1. Recuperación por categoría global</h3><button class="btn small secondary" onclick='downloadCSV("recuperacion_global.csv",DATA.recuperacionGlobal)'>CSV</button></div>${bars((DATA.recuperacionGlobal||[]).slice(0,12),'Categoría','Venta histórica a recuperar',{money:true})}${table((DATA.recuperacionGlobal||[]).slice(0,20),{scroll:true,cols:['Categoría','Clientes por recuperar','Venta histórica a recuperar','Productos referencia']})}</div><div class="panel"><div class="panel-head"><h3>2. Colocación de categoría por cliente</h3><button class="btn small secondary" onclick='downloadCSV("colocacion_cliente.csv",(DATA.colocacionCliente||[]).filter(r=>!selectedVendor||r.Vendedor===selectedVendor))'>CSV</button></div>${table(coloc,{scroll:true,cols:['Vendedor','Cliente','Categoría','Producto / referencia','Venta actual']})}</div></div><div class="grid-2"><div class="panel"><div class="panel-head"><h3>3. Recuperación por vendedor</h3><button class="btn small secondary" onclick='downloadCSV("recuperacion_vendedor.csv",DATA.recuperacionVendedor)'>CSV</button></div>${bars(DATA.recuperacionVendedor||[],'Vendedor','Venta histórica',{money:true})}${table(DATA.recuperacionVendedor||[],{cols:['Vendedor','Clientes','Categorías a recuperar','Oportunidades','Venta histórica','Participación %']})}</div><div class="panel"><div class="panel-head"><h3>4. Colocación por vendedor</h3><button class="btn small secondary" onclick='downloadCSV("colocacion_vendedor.csv",DATA.colocacionVendedor)'>CSV</button></div>${bars(DATA.colocacionVendedor||[],'Vendedor','Venta colocada',{money:true})}${table(DATA.colocacionVendedor||[],{cols:['Vendedor','Clientes','Categorías colocadas','Venta colocada','Participación %']})}</div></div><div class="panel"><div class="panel-head"><h3>5. Detalle completo</h3><button class="btn small secondary" onclick='downloadCSV("detalle_categorias.csv",(DATA.categoriaDetalle||[]).filter(r=>!selectedVendor||r.Vendedor===selectedVendor))'>CSV</button></div>${table(detail,{scroll:true,cols:['Tipo','Vendedor','Cliente','Categoría','Producto / referencia','Venta histórica','Venta actual','Último mes compra','Meses sin comprar','Acción sugerida']})}</div>`; if($('catVendor')) $('catVendor').value=v}
function renderProspectos(){let rec=DATA.clientesRecuperados||[], pros=DATA.prospectosNuevos||[]; $('view').innerHTML=`<div class="grid-2"><div class="panel"><div class="panel-head"><h3>Clientes recuperados</h3><button class="btn small secondary" onclick='downloadCSV("clientes_recuperados.csv",DATA.clientesRecuperados)'>CSV</button></div><div class="note">Muestra categorías y productos recuperados, último mes de compra y meses sin comprar.</div>${table(rec,{scroll:true,cols:['Vendedor','Cliente','Categorías recuperadas','Productos recuperados','Venta actual','Último mes compra','Meses sin comprar']})}</div><div class="panel"><div class="panel-head"><h3>Prospectos nuevos</h3><button class="btn small secondary" onclick='downloadCSV("prospectos_nuevos.csv",DATA.prospectosNuevos)'>CSV</button></div><div class="note">Cuentas nuevas sin compra previa dentro del año cargado.</div>${table(pros,{scroll:true,cols:['Vendedor','Cliente','Categorías compradas','Productos comprados','Venta actual','Criterio']})}</div></div>`}
function renderCartera(){let rows=(DATA.carteraVencida||[]).slice().sort((a,b)=>Number(b.Deuda)-Number(a.Deuda)); $('view').innerHTML=`<div class="grid-2"><div class="panel"><h3>Gráfica de deuda por vendedor</h3>${bars(rows,'Vendedor','Deuda',{money:true})}</div><div class="panel"><div class="panel-head"><h3>Tabla cartera vencida</h3><button class="btn small secondary" onclick='downloadCSV("cartera_vencida.csv",DATA.carteraVencida)'>CSV</button></div>${table(rows,{cols:['Vendedor','Deuda']})}</div></div>`}
function renderGiro(){let v=$('giroVendor')?.value ?? selectedVendor; selectedVendor=v; let detail=(DATA.giroDetalle||[]).filter(r=>!v||r.Vendedor===v); let chartRows=v?(DATA.giroVendorChart||[]).filter(r=>r.Vendedor===v):(DATA.giroResumen||[]).map(r=>({Giro:r.Giro,Venta:r.Venta})); $('view').innerHTML=`<div class="panel"><div class="panel-head"><h3>Venta por giro</h3><button class="btn small secondary" onclick='downloadCSV("venta_por_giro.csv",DATA.giroResumen)'>CSV</button></div>${bars(chartRows,'Giro','Venta',{money:true})}${table(DATA.giroResumen||[],{cols:['Giro','Clientes','Venta','Participación %']})}</div><div class="panel"><div class="panel-head"><h3>Relación por vendedor</h3><button class="btn small secondary" onclick='downloadCSV("giro_relacion_vendedor.csv",DATA.giroRelacionVendedor)'>CSV</button></div>${table(DATA.giroRelacionVendedor||[],{scroll:true,cols:['Vendedor','Clientes','Giros atendidos','Venta','Giro principal','Giros que no está atacando']})}</div><div class="panel"><div class="panel-head"><h3>Detalle giro clientes</h3><div class="toolbar">${vendorSelect('giroVendor','renderGiro()')}<button class="btn small secondary" onclick='downloadCSV("detalle_giro_clientes.csv",(DATA.giroDetalle||[]).filter(r=>!selectedVendor||r.Vendedor===selectedVendor))'>CSV</button></div></div><div class="note">Selecciona un vendedor para ver los montos por giro que representa.</div>${v?bars(chartRows,'Giro','Venta',{money:true}):''}${table(detail,{scroll:true,cols:['Vendedor','Código','Cliente','Giro','Venta','% del vendedor']})}</div>`; if($('giroVendor')) $('giroVendor').value=v}
function renderConfig(){let metas=DATA.metasConfig||[]; $('view').innerHTML=`<div class="grid-2"><div class="panel"><h3>Cargar alimentador único</h3><p>Carga el JSON del mes nuevo. La app <b>mantiene tus metas guardadas</b> y sólo actualiza ventas, visitas, categorías, clientes, cartera y giro.</p><input type="file" accept=".json" onchange="loadJSON(this.files[0])"><div id="jsonMsg" class="load-ok">Periodo actual: ${esc(DATA.periodo)}. Meses disponibles: ${periodKeys().map(periodShort).join(' | ')}</div><div class="mini-help">Cambia de mes desde el filtro superior. Esta versión incluye Junio y Julio para comparar meses anteriores.</div></div><div class="panel"><h3>Filtro por mes disponible</h3><p>El selector superior permite cambiar entre los alimentadores cargados.</p>${periodKeys().map(k=>`<span class="pill" style="margin:4px">${esc(periodShort(k))}</span>`).join('')}</div></div><div class="panel"><div class="panel-head"><h3>Modificar metas</h3><button class="btn small" onclick="applyMetas()">Guardar metas</button></div><div class="note">Estas metas quedan protegidas en el navegador. Al cargar un alimentador nuevo, no se reemplazan por las metas del archivo.</div><div class="table-wrap"><table><thead><tr><th>Vendedor</th><th>Meta mínima editable</th></tr></thead><tbody>${metas.map(r=>`<tr><td>${esc(r.Vendedor)}</td><td><input class="editable" data-v="${esc(r.Vendedor)}" value="${Number(r.Meta||0).toFixed(2)}"></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>Notas de cálculo</h3><ul>${(DATA.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`}
function loadJSON(file){if(!file)return;let fr=new FileReader();fr.onload=e=>{try{let obj=JSON.parse(e.target.result);let savedMetaMap=getCurrentMetaMap();obj=applyMetaMapToDataset(obj,savedMetaMap);PERIODS[obj.periodo||('Periodo '+(periodKeys().length+1))]=obj;DATA=obj;window.RANKING_DATA=obj;window.RANKING_PERIODS=PERIODS;selectedVendor=DATA.dashboard?.[0]?.Vendedor||'';renderPeriodControl();let msg=$('jsonMsg');if(msg){msg.className='load-ok';msg.textContent='Alimentador cargado correctamente: '+DATA.periodo+'. Las metas editadas se conservaron.'}show('dashboard')}catch(err){let msg=$('jsonMsg');if(msg){msg.className='load-warn';msg.textContent='Error al cargar JSON: '+err.message}}};fr.readAsText(file,'utf-8')}
function applyMetas(){let inputs=[...document.querySelectorAll('.editable')];let map={};inputs.forEach(i=>map[i.dataset.v]=Number(String(i.value).replace(/[$,]/g,''))||0);saveMetaMap(map);Object.keys(PERIODS).forEach(k=>applyMetaMapToDataset(PERIODS[k],map));DATA=applyMetaMapToDataset(DATA,map);alert('Metas guardadas. Se conservarán aunque cargues otro alimentador.');show('dashboard')}
window.addEventListener('DOMContentLoaded' ,()=>{ if(!DATA){$('loadState').classList.remove('hidden')} });
window.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('login').classList.contains('hidden'))login()});
</script>
</body>
</html>
