 {kind:'ventas',title:'DATA (1) · Ventas histórico / actual',desc:'Un solo archivo alimenta Meta de Ventas, Categorías, Prospectos y Recuperación de clientes. Usa el mes activo para KPIs y los meses anteriores para comparar.',template:'plantilla_ventas_data.csv'},

let db=null,currentTab='dashboard',cache={sig:'',val:null},giroFilter='TODOS';

function norm(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^\w\s.-]/g,' ').replace(/\s+/g,' ').trim();}
function key(s){return norm(s);}
function monthLabel(period){const [y,m]=String(period||'').split('-');return (MONTH_NAMES[Number(m)]||m)+' '+y;}
function prevPeriod(period){let [y,m]=period.split('-').map(Number);m--;if(m<1){m=12;y--;}return `${y}-${String(m).padStart(2,'0')}`;}
function parseNumber(v){if(v===null||v===undefined)return 0;if(typeof v==='number'&&isFinite(v))return v;let s=String(v).trim();if(!s)return 0;s=s.replace(/\$/g,'').replace(/\s/g,'');const lastComma=s.lastIndexOf(','),lastDot=s.lastIndexOf('.');if(lastComma>lastDot){s=s.replace(/\./g,'').replace(',','.');}else{s=s.replace(/,/g,'');}const n=Number(s.replace(/[^\d.-]/g,''));return isFinite(n)?n:0;}
function fmt(n){return (parseNumber(n)).toLocaleString('es-MX',{maximumFractionDigits:0});}
function money(n){return (parseNumber(n)).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});}
function pct(n){return (parseNumber(n)).toLocaleString('es-MX',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1});}
function get(obj,names){if(!obj)return'';const ks=Object.keys(obj);for(const name of names){const nk=norm(name);for(const k of ks){if(norm(k)===nk)return obj[k];}}for(const name of names){const nk=norm(name);for(const k of ks){if(norm(k).includes(nk)||nk.includes(norm(k)))return obj[k];}}return'';}
function csvEscape(v){const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function downloadCSV(filename,rows,cols){const data=[cols.join(','),...rows.map(r=>cols.map(c=>csvEscape(r[c])).join(','))].join('\n');const blob=new Blob(['\uFEFF'+data],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
function unique(arr){return [...new Set(arr.filter(Boolean))];}
function addMap(map,k,v){map.set(k,(map.get(k)||0)+parseNumber(v));}
function safeDatePeriod(row){let y=parseNumber(row.year||row['Date - Año']||get(row,['Date - Año','Año','Year']));let m=String(row.month||row['Date - Mes']||get(row,['Date - Mes','Mes','Month'])).trim();if(!y&&row.date){const d=new Date(row.date);if(!isNaN(d)){y=d.getUTCFullYear();m=String(d.getUTCMonth()+1).padStart(2,'0');}}let mm=MONTHS[norm(m)]||String(parseNumber(m)||'').padStart(2,'0');if(y&&mm&&mm!=='00')return `${y}-${mm}`;return'';}

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE);};req.onsuccess=e=>resolve(e.target.result);req.onerror=()=>reject(req.error);});}
function idbSet(k,v){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
function idbGet(k){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).get(k);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function idbDel(k){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(k);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
function saveConfig(){localStorage.setItem(META_KEY,JSON.stringify({config:state.config,updatedAt:state.updatedAt}));}

function splitCSVLine(line,delim){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===delim&&!q){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out;}
function parseDelimited(text){text=String(text||'').replace(/^\uFEFF/,'');if(/<table/i.test(text))return parseHtmlTable(text);const lines=text.split(/\r?\n/).filter(l=>l.trim()!='');if(!lines.length)return[];const first=lines[0];const delim=(first.match(/\t/g)||[]).length>=(first.match(/,/g)||[]).length?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');const rows=lines.map(l=>splitCSVLine(l,delim));let hi=0,best=-1;for(let i=0;i<Math.min(12,rows.length);i++){const score=rows[i].filter(c=>String(c).trim()).length;if(score>best){best=score;hi=i;}}return rowsToObjects(rows,hi);}
function parseHtmlTable(text){const doc=new DOMParser().parseFromString(text,'text/html');const table=doc.querySelector('table');if(!table)return[];const trs=[...table.querySelectorAll('tr')];const rows=trs.map(tr=>[...tr.children].map(td=>td.textContent.trim()));let hi=0,best=-1;for(let i=0;i<Math.min(10,rows.length);i++){const score=rows[i].filter(Boolean).length;if(score>best){best=score;hi=i;}}return rowsToObjects(rows,hi);}
function rowsToObjects(rows,headerIndex){const headers=(rows[headerIndex]||[]).map((h,i)=>String(h||`Col${i+1}`).trim()||`Col${i+1}`);const out=[];for(let i=headerIndex+1;i<rows.length;i++){const r=rows[i]||[];if(!r.some(c=>String(c||'').trim()))continue;const o={};headers.forEach((h,j)=>o[h]=r[j]??'');out.push(o);}return out;}
function headerScore(row,kind){const h=(row||[]).map(norm).join('|');let score=0;const has=w=>h.includes(norm(w));if(kind==='ventas'){['AGENTE_DE_VENTAS_CLIENTE','NOMBRE_SN','DESCRIPCION_PRODUCTO','SUBTOTAL','DATE'].forEach(x=>{if(has(x))score+=2;});}
else if(kind==='categorias'){['DESCRIPCION DE PRODUCTO','CATEGORIA','CODIGO DE PRODUCTO'].forEach(x=>{if(has(x))score+=3;});}
else if(kind==='visitas'){['VENDOR','CLIENT','DAY','TYPE','START_TS'].forEach(x=>{if(has(x))score+=2;});}
else if(kind==='metas'){['VENDEDOR','META'].forEach(x=>{if(has(x))score+=4;});}
else if(kind==='noCobrado'){['VENDEDOR','SALDO','DEUDA'].forEach(x=>{if(has(x))score+=3;});}
else if(kind==='giro'){['CLIENTE','GIRO','VENTA','SUBTOTAL'].forEach(x=>{if(has(x))score+=3;});}
return score;}
async function parseFile(file,kind){const name=(file.name||'').toLowerCase();if(name.endsWith('.xls')){const text=await file.text();if(/<table/i.test(text))return parseHtmlTable(text);}
if(name.endsWith('.xlsx')||name.endsWith('.xls')){if(!window.XLSX)throw new Error('No cargó la librería XLSX. Abre con internet o guarda como CSV.');const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',raw:false,cellDates:false});let best={score:-1,rows:null,idx:0,sheet:''};for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false});for(let i=0;i<Math.min(rows.length,80);i++){const score=headerScore(rows[i],kind);if(score>best.score)best={score,rows,idx:i,sheet:sn};}}if(!best.rows)return[];return rowsToObjects(best.rows,best.idx);}
const text=await file.text();return parseDelimited(text);}
function normalizeRows(kind,rows){if(kind==='ventas')return rows.map(r=>{const vendor=String(get(r,['AGENTE_DE_VENTAS_CLIENTE','ALMACEN AGRUPADO','Vendedor','Agente'])||'').trim();const client=String(get(r,['NOMBRE_SN','Cliente','Nombre SN','Nombre del cliente'])||'').trim();const product=String(get(r,['DESCRIPCION_PRODUCTO','DESCRIPCION DE PRODUCTO','Producto','Descripcion'])||'').trim();const amount=parseNumber(get(r,['Suma de SUBTOTAL','SUBTOTAL','Importe','Venta','Venta MES']));const year=get(r,['Date - Año','Año','Year']);const month=get(r,['Date - Mes','Mes','Month']);const day=get(r,['Date - Día','Dia','Día','Day']);const period=safeDatePeriod({year,month,date:get(r,['Date','Fecha'])});return {vendedor:vendor,cliente:client,producto:product,importe:amount,year:String(year||''),month:String(month||''),day:String(day||''),period};}).filter(r=>r.vendedor&&r.cliente&&r.producto&&r.period);
if(kind==='categorias')return rows.map(r=>({codigo:String(get(r,['CODIGO DE PRODUCTO','Codigo','Articulo'])||'').trim(),producto:String(get(r,['DESCRIPCION DE PRODUCTO','DESCRIPCION_PRODUCTO','Producto','Descripcion'])||'').trim(),categoria:String(get(r,['Categoria','Categoría'])||'SIN CATEGORÍA').trim()||'SIN CATEGORÍA'})).filter(r=>r.producto);
if(kind==='visitas')return rows.map(r=>{const rawVendor=String(get(r,['vendor','Vendedor','Agente'])||'').trim();const map=VISIT_VENDOR_MAP[key(rawVendor)];if(!map)return null;const day=String(get(r,['day','Fecha','Date'])||'').trim();let period='';if(day){const d=new Date(day);if(!isNaN(d))period=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;else if(/^\d{4}-\d{2}/.test(day))period=day.slice(0,7);}return {vendedor:map.name,kpiVendedor:map.kpi,vendedorExcel:rawVendor,cliente:String(get(r,['client','Cliente'])||'').trim(),tipo:String(get(r,['type','Tipo'])||'').trim(),ciudad:String(get(r,['city','Ciudad'])||'').trim(),fecha:day,period,duracionMin:parseNumber(get(r,['duration_min','DuracionMin','Duración Min']))||(parseNumber(get(r,['duration_sec','duration_sec']))/60),notas:String(get(r,['notes','Notas'])||'').trim()};}).filter(Boolean);
if(kind==='metas')return rows.map(r=>({vendedor:String(get(r,['Vendedor','Etiquetas de fila','ALMACEN AGRUPADO'])||'').trim(),meta:parseNumber(get(r,['Meta','META MÍNIMA','Meta minima','Meta mínima']))})).filter(r=>r.vendedor);
if(kind==='noCobrado')return rows.map(r=>({vendedor:String(get(r,['Vendedor','AGENTE_DE_VENTAS_CLIENTE','ALMACEN AGRUPADO'])||'').trim(),deuda:parseNumber(get(r,['Saldo','Deuda','No cobrado','Vencido'])||0)})).filter(r=>r.vendedor);
if(kind==='giro')return rows.map(r=>({vendedor:String(get(r,['Vendedor','AGENTE_DE_VENTAS_CLIENTE','ALMACEN AGRUPADO'])||'').trim(),codigo:String(get(r,['CODIGO DE SN','Código','Codigo'])||'').trim(),cliente:String(get(r,['Cliente','NOMBRE_SN','Nombre SN'])||'').trim(),giro:String(get(r,['Giro','GIRO_CLIENTE','Canal'])||'SIN GIRO').trim()||'SIN GIRO',venta:parseNumber(get(r,['Venta','SUBTOTAL','Importe','Suma de SUBTOTAL'])||0)})).filter(r=>r.cliente||r.giro);
return rows;}
async function loadRows(kind,rows,source){state[kind]=normalizeRows(kind,rows);await saveDataset(kind);alert(`Carga lista: ${state[kind].length.toLocaleString('es-MX')} registros en ${source||kind}`);}

function buildAnalysis(){
 const sig=JSON.stringify({p:state.config.period,ventas:state.ventas.length,cat:state.categorias.length,vis:state.visitas.length,metas:state.metas.length,cob:state.noCobrado.length,giro:state.giro.length});
 if(cache.sig===sig&&cache.val)return cache.val;
 const period=state.config.period, prev=prevPeriod(period);
 const catMap=new Map();state.categorias.forEach(r=>{catMap.set(key(r.producto),r.categoria||'SIN CATEGORÍA');});
 const current=state.ventas.filter(r=>r.period===period);
 const hist=state.ventas.filter(r=>r.period&&r.period<period);
 const prevRows=state.ventas.filter(r=>r.period===prev);
 const salesByVendor=new Map();current.forEach(r=>addMap(salesByVendor,r.vendedor,r.importe));
 const metas=state.metas.length?state.metas:DEFAULT_METAS;const metaMap=new Map(metas.map(r=>[r.vendedor,parseNumber(r.meta)]));
 const vendors=unique([...metas.map(r=>r.vendedor),...current.map(r=>r.vendedor)]).filter(v=>!VENDOR_BLOCKLIST.includes(norm(v)));
 const metaRows=vendors.map(v=>{const venta=salesByVendor.get(v)||0, meta=metaMap.get(v)||0, avance=meta?venta/meta:0;return {'Vendedor':v,'Meta':money(meta),'Venta real':money(venta),'Avance %':pct(avance),'Faltante en monto':money(Math.max(meta-venta,0)),'_avance':avance,'_venta':venta,'_meta':meta};}).sort((a,b)=>b._avance-a._avance||b._venta-a._venta);
 const totalVenta=current.reduce((s,r)=>s+r.importe,0), totalMeta=metaRows.reduce((s,r)=>s+r._meta,0);

 const visitRows=state.visitas.filter(r=>!r.period||r.period===period);
 const monthlyGoal=parseNumber(state.config.visitWeeklyGoal)*parseNumber(state.config.visitWeeks);
 const visitMap=new Map();const clientSetByVisit=new Map();
 visitRows.forEach(r=>{addMap(visitMap,r.vendedor,1);if(!clientSetByVisit.has(r.vendedor))clientSetByVisit.set(r.vendedor,new Set());if(r.cliente)clientSetByVisit.get(r.vendedor).add(r.cliente);});
 const visitNames=Object.values(VISIT_VENDOR_MAP).map(x=>x.name);const visitVendors=unique(visitNames).filter(v=>visitMap.has(v)||true);
 const visitSummary=visitVendors.map(v=>{const count=visitMap.get(v)||0;return {'Vendedor':v,'Visitas en el mes':count,'Avance %':pct(monthlyGoal?count/monthlyGoal:0),'Meta mensual':monthlyGoal,'Clientes únicos':(clientSetByVisit.get(v)||new Set()).size,'_avance':monthlyGoal?count/monthlyGoal:0};}).sort((a,b)=>b['Visitas en el mes']-a['Visitas en el mes']);

 function catOf(product){return catMap.get(key(product))||'SIN CATEGORÍA';}
 const curCC=new Map(), histCC=new Map(), histCCPeriods=new Map(), lastVendorCC=new Map(), curVendorCC=new Map(), curClient=new Map(), histClient=new Map(), prevClient=new Set();
 current.forEach(r=>{const cat=catOf(r.producto), k=key(r.cliente)+'||'+key(cat);addMap(curCC,k,r.importe);curVendorCC.set(k,r.vendedor);addMap(curClient,r.cliente,r.importe);});
 hist.forEach(r=>{const cat=catOf(r.producto), k=key(r.cliente)+'||'+key(cat);addMap(histCC,k,r.importe);lastVendorCC.set(k,r.vendedor);if(!histCCPeriods.has(k))histCCPeriods.set(k,new Set());histCCPeriods.get(k).add(r.period);addMap(histClient,r.cliente,r.importe);});
 prevRows.forEach(r=>prevClient.add(key(r.cliente)));
 const keyInfo=new Map();[...current,...hist].forEach(r=>{const cat=catOf(r.producto), k=key(r.cliente)+'||'+key(cat);if(!keyInfo.has(k))keyInfo.set(k,{cliente:r.cliente,categoria:cat});});
 const recDetail=[], placeDetail=[];
 for(const [k,hval] of histCC.entries()){if(!curCC.has(k)){const inf=keyInfo.get(k)||{}, m=(histCCPeriods.get(k)||new Set()).size||1, opp=hval/m;recDetail.push({'Tipo':'Recuperación pendiente','Vendedor':lastVendorCC.get(k)||'','Cliente':inf.cliente||'','Categoría':inf.categoria||'SIN CATEGORÍA','Promedio histórico mensual':money(opp),'Oportunidad $':money(opp),'Venta actual':money(0),'Venta histórica':money(hval),'_amount':opp});}}
 for(const [k,cval] of curCC.entries()){if(!histCC.has(k)){const inf=keyInfo.get(k)||{};placeDetail.push({'Tipo':'Colocación nueva','Vendedor':curVendorCC.get(k)||'','Cliente':inf.cliente||'','Categoría':inf.categoria||'SIN CATEGORÍA','Promedio histórico mensual':money(0),'Oportunidad $':money(0),'Venta actual':money(cval),'Venta histórica':money(0),'_amount':cval});}}
 function groupCat(rows,field){const m=new Map(), clients=new Map();rows.forEach(r=>{addMap(m,r[field],r._amount);if(!clients.has(r[field]))clients.set(r[field],new Set());clients.get(r[field]).add(r.Cliente);});const total=[...m.values()].reduce((a,b)=>a+b,0);return [...m.entries()].map(([k,v])=>({'Categoría':k,'Clientes':(clients.get(k)||new Set()).size,'Venta $':money(v),'Participación %':pct(total?v/total:0),'_amount':v})).sort((a,b)=>b._amount-a._amount);}
 function groupVend(rows){const m=new Map(), clients=new Map();rows.forEach(r=>{addMap(m,r.Vendedor,r._amount);if(!clients.has(r.Vendedor))clients.set(r.Vendedor,new Set());clients.get(r.Vendedor).add(r.Cliente+'|'+r.Categoría);});const total=[...m.values()].reduce((a,b)=>a+b,0);return [...m.entries()].map(([k,v])=>({'Vendedor':k,'Clientes/Categorías':(clients.get(k)||new Set()).size,'Venta $':money(v),'Participación %':pct(total?v/total:0),'_amount':v})).sort((a,b)=>b._amount-a._amount);}
 const recCat=groupCat(recDetail,'Categoría').map(r=>({'Categoría':r['Categoría'],'Clientes':r['Clientes'],'Oportunidad $':r['Venta $'],'Participación %':r['Participación %'],'_amount':r._amount}));
 const placeCat=groupCat(placeDetail,'Categoría').map(r=>({'Categoría':r['Categoría'],'Clientes':r['Clientes'],'Venta actual':r['Venta $'],'Participación %':r['Participación %'],'_amount':r._amount}));
 const recVend=groupVend(recDetail).map(r=>({'Vendedor':r['Vendedor'],'Clientes/Categorías':r['Clientes/Categorías'],'Oportunidad $':r['Venta $'],'Participación %':r['Participación %'],'_amount':r._amount}));
 const placeVend=groupVend(placeDetail).map(r=>({'Vendedor':r['Vendedor'],'Clientes/Categorías':r['Clientes/Categorías'],'Venta actual':r['Venta $'],'Participación %':r['Participación %'],'_amount':r._amount}));
 const catDetail=[...recDetail,...placeDetail].sort((a,b)=>b._amount-a._amount).slice(0,5000);

 const currentClients=[...curClient.entries()];const recovered=[], prospects=[];
 currentClients.forEach(([client,amount])=>{const k=key(client);const vendor=(current.find(r=>key(r.cliente)===k)||{}).vendedor||'';if(!histClient.has(client)&&![...histClient.keys()].some(c=>key(c)===k)){prospects.push({'Vendedor':vendor,'Cliente':client,'Venta actual':money(amount),'_amount':amount});}else if(!prevClient.has(k)){recovered.push({'Vendedor':vendor,'Cliente':client,'Venta actual':money(amount),'Venta histórica':money(histClient.get(client)||0),'_amount':amount});}});
 prospects.sort((a,b)=>b._amount-a._amount);recovered.sort((a,b)=>b._amount-a._amount);

 const debtMap=new Map();state.noCobrado.forEach(r=>addMap(debtMap,r.vendedor,r.deuda));const debtRows=[...debtMap.entries()].map(([v,d])=>({'Vendedor':v,'Deuda':money(d),'_deuda':d})).sort((a,b)=>b._deuda-a._deuda);

 const giroRows=state.giro;let gf=giroFilter;const gFiltered=gf==='TODOS'?giroRows:giroRows.filter(r=>r.vendedor===gf);const gTotal=gFiltered.reduce((s,r)=>s+r.venta,0);const gByGiro=new Map(), gClient=new Map(), gVend=new Map();
 gFiltered.forEach(r=>{addMap(gByGiro,r.giro,r.venta);if(!gClient.has(r.giro))gClient.set(r.giro,new Set());gClient.get(r.giro).add(r.cliente);addMap(gVend,r.vendedor||'SIN VENDEDOR',r.venta);});
 const giroResumen=[...gByGiro.entries()].map(([g,v])=>({'Giro':g,'Clientes':(gClient.get(g)||new Set()).size,'Venta $':money(v),'Participación %':pct(gTotal?v/gTotal:0),'_amount':v})).sort((a,b)=>b._amount-a._amount);
 const giroVend=[...gVend.entries()].map(([v,a])=>({'Vendedor':v,'Venta $':money(a),'Participación %':pct(gTotal?a/gTotal:0),'_amount':a})).sort((a,b)=>b._amount-a._amount);
 const giroDetail=gFiltered.map(r=>({'Vendedor':r.vendedor,'Código':r.codigo,'Cliente':r.cliente,'Giro':r.giro,'Venta $':money(r.venta),'% filtro':pct(gTotal?r.venta/gTotal:0)})).sort((a,b)=>parseNumber(b['Venta $'])-parseNumber(a['Venta $']));

 const rank=metaRows.map(m=>{const vk=Object.values(VISIT_VENDOR_MAP).find(x=>x.kpi===m.Vendedor);const vrow=vk?visitSummary.find(x=>x.Vendedor===vk.name):null;const ventaScore=Math.min(m._avance,1);const visitaScore=vrow?Math.min(vrow._avance,1):0;const debt=debtMap.get(m.Vendedor)||0;const debtScore=debt>0?Math.max(0,1-debt/(m._venta||m._meta||1)):1;const score=(ventaScore*.50)+(visitaScore*.25)+(debtScore*.25);return {'Ranking':0,'Vendedor':m.Vendedor,'Venta %':pct(m._avance),'Visitas %':vrow?pct(vrow._avance):'N/A','Cartera':money(debt),'Score':pct(score),'Venta real':m['Venta real'],'Faltante':m['Faltante en monto'],'_score':score};}).sort((a,b)=>b._score-a._score);rank.forEach((r,i)=>r.Ranking=i+1);

 const val={period,current,hist,metaRows,totalVenta,totalMeta,visitSummary,visitRows,recCat,placeCat,recVend,placeVend,catDetail,recovered,prospects,debtRows,giroResumen,giroVend,giroDetail,giroTotal:gTotal,rank};
 cache={sig,val};return val;
}

function renderTable(id,rows,cols,file,opt={}){const el=document.getElementById(id);const title=opt.title||'';const compact=!!opt.compact;const cls=compact?'table-scroll compact no-x':'table-scroll';const limited=rows.slice(0,opt.limit||2000);el.innerHTML=`<div class="toolbar"><h3>${title}</h3><div class="actions"><span class="badge">${rows.length.toLocaleString('es-MX')} registros</span><button class="mini" data-export="${id}">Exportar CSV</button></div></div><div class="${cls}">${limited.length?`<table class="${opt.dashboard?'dashboard-table':''}"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${limited.map(r=>`<tr>${cols.map(c=>cellHtml(r[c],c)).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">Sin información cargada para esta tabla.</div>'}</div>`;el.querySelector('[data-export]').onclick=()=>downloadCSV(file||'export.csv',rows,cols);}
function cellHtml(v,c){const n=/monto|venta|meta|deuda|faltante|saldo|oportunidad|cartera/i.test(c);const center=/avance|score|ranking|participación|%/i.test(c);let cls=n?'num':(center?'center':'');let val=v??'';if(/avance|score|participación|%/i.test(c)){const raw=parseNumber(String(val).replace('%',''));let pill=''; if(String(val).includes('%')){if(raw>=100)pill='pill-good';else if(raw>=70)pill='pill-warn';else pill='pill-bad';} return `<td class="${cls}"><span class="badge ${pill}">${val}</span></td>`;}return `<td class="${cls}">${String(val)}</td>`;}
function viewHeader(title,desc){return `<div class="section-title"><div><h2>${title}</h2><p>${desc}</p></div><span class="badge">${state.config.monthLabel||monthLabel(state.config.period)}</span></div>`;}
function cards(items){return `<div class="grid">${items.map(it=>`<div class="card"><h3>${it.t}</h3><p>${it.s||''}</p><div class="kpi ${it.c||''}">${it.v}</div></div>`).join('')}</div>`;}

function renderDashboard(){const a=buildAnalysis();const avg=a.rank.length?a.rank.reduce((s,r)=>s+parseNumber(r.Score)/100,0)/a.rank.length:0;document.getElementById('dashboard').innerHTML=viewHeader('Dashboard','Tabulador de ranking por vendedor. La tabla está compacta para verse completa sin scroll lateral.')+cards([{t:'Venta real mes',v:money(a.totalVenta),s:'Suma DATA(1) del periodo activo'},{t:'Meta global',v:money(a.totalMeta),s:'Suma metas mínimas cargadas'},{t:'Avance global',v:pct(a.totalMeta?a.totalVenta/a.totalMeta:0),s:'Venta / Meta',c:a.totalMeta&&a.totalVenta/a.totalMeta>=1?'positive':'warning'},{t:'Score promedio',v:pct(avg),s:'Ventas + Visitas + Cartera'}])+`<div class="tablebox" id="dashTable"></div>`;renderTable('dashTable',a.rank,['Ranking','Vendedor','Venta %','Visitas %','Cartera','Score','Venta real','Faltante'],'dashboard_ranking.csv',{title:'Ranking general de KPIs',compact:true,dashboard:true});}
function renderMetas(){const a=buildAnalysis();document.getElementById('metas').innerHTML=viewHeader('Meta de Ventas','La venta real sale de DATA(1) usando únicamente el mes activo. La meta se carga o edita desde Configuración.')+`<div class="tablebox" id="metasTable"></div>`;renderTable('metasTable',a.metaRows,['Vendedor','Meta','Venta real','Avance %','Faltante en monto'],'meta_ventas.csv',{title:'Avance de meta de ventas'});}
function renderVisitas(){const a=buildAnalysis();const detail=a.visitRows.map(r=>({'Fecha':r.fecha,'Vendedor':r.vendedor,'Nombre en Excel':r.vendedorExcel,'Cliente':r.cliente,'Tipo':r.tipo,'Ciudad':r.ciudad,'Duración min':Math.round(r.duracionMin||0),'Notas':r.notas}));document.getElementById('visitas').innerHTML=viewHeader('Visita de clientes','Sólo se consideran los vendedores autorizados. La meta mensual es meta semanal × semanas configuradas.')+`<div class="tablebox" id="vis1"></div><div class="tablebox" id="vis2"></div>`;renderTable('vis1',a.visitSummary,['Vendedor','Visitas en el mes','Avance %','Meta mensual','Clientes únicos'],'visitas_resumen.csv',{title:'Primera tabla · Avance por vendedor'});renderTable('vis2',detail,['Fecha','Vendedor','Nombre en Excel','Cliente','Tipo','Ciudad','Duración min','Notas'],'visitas_detalle.csv',{title:'Segunda tabla · Detalle de visitas cargadas'});}
function renderCategorias(){const a=buildAnalysis();document.getElementById('categorias').innerHTML=viewHeader('Incremento y recuperación de Categoría','DATA(1) del mes activo se compara contra meses anteriores. Categorías toma la relación producto → categoría del Excel Categorías.')+`<div class="grid two"><div class="tablebox" id="cat1"></div><div class="tablebox" id="cat2"></div></div><div class="grid two"><div class="tablebox" id="cat3"></div><div class="tablebox" id="cat4"></div></div><div class="tablebox" id="cat5"></div>`;renderTable('cat1',a.recCat,['Categoría','Clientes','Oportunidad $','Participación %'],'recuperacion_categoria_global.csv',{title:'Tabla 1 · Recuperación por categoría global'});renderTable('cat2',a.placeCat,['Categoría','Clientes','Venta actual','Participación %'],'colocacion_categoria_global.csv',{title:'Tabla 2 · Colocación de categoría'});renderTable('cat3',a.recVend,['Vendedor','Clientes/Categorías','Oportunidad $','Participación %'],'recuperacion_categoria_vendedor.csv',{title:'Tabla 3 · Recuperación por vendedor'});renderTable('cat4',a.placeVend,['Vendedor','Clientes/Categorías','Venta actual','Participación %'],'colocacion_categoria_vendedor.csv',{title:'Tabla 4 · Colocación por vendedor'});renderTable('cat5',a.catDetail,['Tipo','Vendedor','Cliente','Categoría','Promedio histórico mensual','Oportunidad $','Venta actual','Venta histórica'],'detalle_incremento_recuperacion_categoria.csv',{title:'Tabla 5 · Detalle completo'});}
function renderProspectos(){const a=buildAnalysis();document.getElementById('prospectos').innerHTML=viewHeader('Prospección y recuperación de clientes','Clientes recuperados: compran en el mes activo, tenían historial, pero no compraron el mes anterior. Prospectos: no tienen historial previo en DATA(1).')+`<div class="grid two"><div class="tablebox" id="pro1"></div><div class="tablebox" id="pro2"></div></div>`;renderTable('pro1',a.recovered,['Vendedor','Cliente','Venta actual','Venta histórica'],'clientes_recuperados.csv',{title:'Tabla 1 · Clientes recuperados'});renderTable('pro2',a.prospects,['Vendedor','Cliente','Venta actual'],'prospectos_nuevos.csv',{title:'Tabla 2 · Prospectos nuevos'});}
function renderCartera(){const a=buildAnalysis();document.getElementById('cartera').innerHTML=viewHeader('Cartera Vencida','Se alimenta con Excel No cobrado del mes vencido. Estructura simple: vendedor y deuda.')+`<div class="tablebox" id="carteraTable"></div>`;renderTable('carteraTable',a.debtRows,['Vendedor','Deuda'],'cartera_vencida.csv',{title:'No cobrado por vendedor'});}
function renderGiro(){const a=buildAnalysis();const options=unique(state.giro.map(r=>r.vendedor)).sort((a,b)=>a.localeCompare(b,'es'));document.getElementById('giro').innerHTML=viewHeader('Giro de Clientes','Información estratégica adicional alimentada por Excel Giro. Se puede filtrar por vendedor.')+`<div class="filters"><label>Filtrar vendedor</label><select id="giroFilter"><option value="TODOS">Todos los vendedores</option>${options.map(v=>`<option value="${v}" ${giroFilter===v?'selected':''}>${v}</option>`).join('')}</select><span class="badge">Venta filtro: ${money(a.giroTotal)}</span></div><div class="grid two"><div class="tablebox" id="giro1"></div><div class="tablebox" id="giro2"></div></div><div class="tablebox" id="giro3"></div>`;document.getElementById('giroFilter').onchange=e=>{giroFilter=e.target.value;cache.sig='';renderGiro();};renderTable('giro1',a.giroResumen,['Giro','Clientes','Venta $','Participación %'],'giro_resumen.csv',{title:'Venta y participación por giro'});renderTable('giro2',a.giroVend,['Vendedor','Venta $','Participación %'],'giro_por_vendedor.csv',{title:'Relación por vendedor'});renderTable('giro3',a.giroDetail,['Vendedor','Código','Cliente','Giro','Venta $','% filtro'],'giro_detalle.csv',{title:'Detalle cliente / giro / vendedor'});}
function renderConfig(){document.getElementById('config').innerHTML=viewHeader('Configuración','Carga todos los Excel desde aquí. Las secciones de KPI quedan sólo para revisar y exportar.')+`<div class="notice ok"><b>Nuevo flujo:</b> DATA(1) alimenta Meta de Ventas, Incremento/Recuperación de Categoría, Prospectos y Recuperación de clientes. Categorías sólo se usa para enlazar producto con categoría. Visitas se carga con admin_visitas_filtros del mes.</div><div class="card"><h3>Periodo y reglas</h3><div class="row"><div class="field"><label>Periodo activo</label><input id="cfgPeriod" type="month" value="${state.config.period}"></div><div class="field"><label>Nombre del reporte</label><input id="cfgMonthLabel" value="${state.config.monthLabel}"></div><div class="field"><label>Meta semanal visitas</label><input id="cfgWeekly" type="number" min="1" step="1" value="${state.config.visitWeeklyGoal}"></div><div class="field"><label>Semanas para visitas</label><input id="cfgWeeks" type="number" min="1" step="1" value="${state.config.visitWeeks}"></div></div><div class="actions"><button class="mini primary" id="saveCfg">Guardar configuración</button><button class="mini" id="loadIncluded">Cargar archivos incluidos del ZIP</button><button class="mini" id="resetAll">Borrar cargas</button></div></div><div class="config-grid">${IMPORTS.map(cardHtml).join('')}</div>`;document.getElementById('saveCfg').onclick=()=>{state.config.period=document.getElementById('cfgPeriod').value||state.config.period;state.config.monthLabel=document.getElementById('cfgMonthLabel').value||monthLabel(state.config.period);state.config.visitWeeklyGoal=parseNumber(document.getElementById('cfgWeekly').value)||25;state.config.visitWeeks=parseNumber(document.getElementById('cfgWeeks').value)||4;state.updatedAt=new Date().toISOString();saveConfig();cache.sig='';renderAll();};document.getElementById('resetAll').onclick=resetAll;document.getElementById('loadIncluded').onclick=loadIncludedFiles;IMPORTS.forEach(it=>{const file=document.getElementById(`file_${it.kind}`),paste=document.getElementById(`paste_${it.kind}`);file.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=await parseFile(f,it.kind);await loadRows(it.kind,rows,f.name);}catch(err){console.error(err);alert('No pude procesar el archivo. Revisa encabezados o guarda como CSV.');}};document.getElementById(`btn_${it.kind}`).onclick=async()=>{await loadRows(it.kind,parseDelimited(paste.value),it.title);};document.getElementById(`clear_${it.kind}`).onclick=()=>clearDataset(it.kind);});}
function cardHtml(it){const count=(state[it.kind]||[]).length;return `<div class="config-card"><h3>${it.title}</h3><div class="help">${it.desc}</div><input id="file_${it.kind}" type="file" accept=".xlsx,.xls,.csv,.txt,.tsv"><textarea class="paste" id="paste_${it.kind}" placeholder="También puedes pegar aquí la tabla desde Excel..."></textarea><div class="actions" style="margin-top:8px"><button class="mini primary" id="btn_${it.kind}">Importar texto</button><button class="mini" onclick="downloadTemplate('${it.template}')">Descargar plantilla</button><button class="mini" id="clear_${it.kind}">Limpiar</button></div><div class="status">Registros cargados: <b>${count.toLocaleString('es-MX')}</b></div></div>`;}
async function loadIncludedFiles(){const files=[['ventas','archivos_base/ventas_data_1.csv'],['categorias','archivos_base/categorias.csv'],['visitas','archivos_base/visitas_junio_2026.csv'],['metas','archivos_base/metas_junio_2026.csv']];try{for(const [kind,path] of files){const text=await fetch(path).then(r=>{if(!r.ok)throw new Error(path);return r.text();});state[kind]=normalizeRows(kind,parseDelimited(text));await idbSet(kind,state[kind]);}state.updatedAt=new Date().toISOString();saveConfig();cache.sig='';renderAll();alert('Listo: se cargaron DATA(1), Categorías, Visitas junio y Metas junio incluidos en el ZIP.');}catch(e){console.error(e);alert('No se pudieron cargar automáticamente los archivos incluidos. Si abriste index.html directo desde tu PC, usa Elegir archivo y carga los CSV de la carpeta archivos_base.');}}
window.downloadTemplate=function(filename){fetch(filename).then(r=>r.ok?r.blob():Promise.reject()).then(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);}).catch(()=>{let content='';if(filename.includes('metas'))content='Vendedor,Meta\nGDL6 - DANIEL  AGUILAR,5227475.61';else if(filename.includes('ventas'))content='AGENTE_DE_VENTAS_CLIENTE,NOMBRE_SN,DESCRIPCION_PRODUCTO,Suma de SUBTOTAL,Date - Año,Date - Mes,Date - Día';else if(filename.includes('categorias'))content='CODIGO DE PRODUCTO,DESCRIPCION DE PRODUCTO,Categoria';else if(filename.includes('visitas'))content='day,city,vendor,client,type,notes,start_ts,end_ts,duration_sec';else if(filename.includes('no_cobrado'))content='Vendedor,Saldo\nGDL6 - DANIEL  AGUILAR,828';else content='Vendedor,Cliente,Giro,Venta';const blob=new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();});};

function renderNav(){document.getElementById('nav').innerHTML=TABS.map(([id,label])=>`<button class="navbtn ${id===currentTab?'active':''}" data-tab="${id}">${label}</button>`).join('');document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;showTab(currentTab);});}
function showTab(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));}
function renderChips(){document.getElementById('chipPeriod').textContent='Periodo: '+(state.config.monthLabel||monthLabel(state.config.period));document.getElementById('chipRows').textContent=`Ventas: ${state.ventas.length.toLocaleString('es-MX')} · Categorías: ${state.categorias.length.toLocaleString('es-MX')} · Visitas: ${state.visitas.length.toLocaleString('es-MX')}`;document.getElementById('chipUpdated').textContent=state.updatedAt?'Actualizado: '+new Date(state.updatedAt).toLocaleString('es-MX'):'Sin carga';}
function renderAll(){renderNav();renderChips();renderDashboard();renderMetas();renderVisitas();renderCategorias();renderProspectos();renderCartera();renderGiro();renderConfig();showTab(currentTab);}
async function init(){await loadState();renderAll();}
init();
})();
</script>
