function norm(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u00A0/g,' ').replace(/[^A-Za-z0-9]+/g,' ').trim().replace(/\s+/g,' ').toUpperCase();}
function headerNorm(s){return norm(s).replace(/ /g,'');}
function cleanVendor(v){let s=String(v??'').replace(/\u00A0/g,' ').trim().replace(/\s+/g,' ');if(!s)return'';const n=norm(s);if(EXCLUDED.has(n))return'';return ALIASES[n]||s;}
function keyVendor(v){return norm(cleanVendor(v));}
function parseNumber(value){if(value===null||value===undefined||value==='')return 0;if(typeof value==='number')return isFinite(value)?value:0;let s=String(value).replace(/\u00A0/g,' ').trim();if(!s)return 0;const neg=/^\(.*\)$/.test(s)||/-$/.test(s);s=s.replace(/[()$MXN\s]/gi,'').replace(/[^0-9,.-]/g,'');if(!s)return 0;const hasComma=s.includes(','),hasDot=s.includes('.');if(hasComma&&hasDot){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',', '.');else s=s.replace(/,/g,'');}else if(hasComma&&!hasDot){const p=s.split(','),last=p[p.length-1];if(last.length<=2)s=p.slice(0,-1).join('')+'.'+last;else s=p.join('');}const n=parseFloat(s);return isFinite(n)?(neg?-n:n):0;}
function monthFromParts(year,month){const y=String(year??'').match(/20\d{2}/);if(!y)return'';let m=String(month??'').trim();let mm='';if(/^\d{1,2}$/.test(m))mm=String(Number(m)).padStart(2,'0');else mm=MONTHS[norm(m)]||'';return mm?`${y[0]}-${mm}`:'';}
function parseMonth(value, yearValue){const direct=monthFromParts(yearValue,value);if(direct)return direct;if(value===null||value===undefined||value==='')return'';if(typeof value==='number'){const d=new Date(Math.round((value-25569)*86400*1000));if(!isNaN(d))return d.toISOString().slice(0,7);}let s=String(value).trim();let m=s.match(/(20\d{2})[-/](0?[1-9]|1[0-2])/);if(m)return m[1]+'-'+String(m[2]).padStart(2,'0');m=s.match(/(\d{1,2})[-/](\d{1,2})[-/](20\d{2})/);if(m)return m[3]+'-'+String(m[2]).padStart(2,'0');const ns=norm(s);for(const [name,num] of Object.entries(MONTHS)){if(ns.includes(name)){const y=(ns.match(/20\d{2}/)||[state.config.period.slice(0,4)])[0];return y+'-'+num;}}return'';}
function monthLabel(ym){const [y,m]=String(ym||'').split('-');return `${MONTH_NAMES[Number(m)]||ym} ${y||''}`.trim();}
function previousMonth(ym){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function pct(n){return (Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';}
function num(n){return (Number(n)||0).toLocaleString('es-MX',{maximumFractionDigits:0});}
function pick(row,aliases){const keys=Object.keys(row||{});const map={};keys.forEach(k=>{map[headerNorm(k)]=k;});for(const a of aliases){const k=map[headerNorm(a)];if(k!==undefined&&row[k]!==undefined&&row[k]!==null&&String(row[k]).trim()!=='')return row[k];}return'';}
function csvEscape(v){let s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function downloadCSV(filename, rows, cols){const text='\uFEFF'+[cols.join(','),...rows.map(r=>cols.map(c=>csvEscape(r[c])).join(','))].join('\n');const blob=new Blob([text],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);}

function splitLine(line,delim){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(c===delim&&!q){out.push(cur.trim());cur='';}else cur+=c;}out.push(cur.trim());return out;}
function parseDelimited(text,kind){text=String(text||'').replace(/^\uFEFF/,'').replace(/\r/g,'').trim();if(!text)return[];if(/<table[\s\S]*<\/table>/i.test(text))return parseHtmlTable(text,kind);const first=text.split('\n').find(l=>l.trim())||'';const delims=['\t',';',',','|'];const delim=delims.map(d=>[d,(first.match(new RegExp('\\'+d,'g'))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];const rows=text.split('\n').filter(l=>l.trim()).map(l=>splitLine(l,delim));return rowsToObjectsAuto(rows,kind);}
function parseHtmlTable(html,kind){const doc=new DOMParser().parseFromString(html,'text/html');const table=doc.querySelector('table');if(!table)return[];const rows=[...table.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.textContent.trim()));return rowsToObjectsAuto(rows,kind);}
function headerScore(row,kind){const hints=HEADER_HINTS[kind]||[];const cells=row.map(headerNorm);let score=0;for(const h of hints){const nh=headerNorm(h);if(cells.includes(nh))score+=3;else if(cells.some(c=>c.includes(nh)||nh.includes(c)))score+=1;}return score;}
function rowsToObjectsAuto(rows,kind){if(!rows||!rows.length)return[];let best={score:-1,idx:0};for(let i=0;i<Math.min(rows.length,80);i++){const non=rows[i].filter(c=>String(c||'').trim()).length;const s=non>1?headerScore(rows[i],kind):0;if(s>best.score)best={score:s,idx:i};}return rowsToObjects(rows,best.idx);}
function rowsToObjects(rows,idx){const headers=rows[idx].map((h,i)=>String(h||`COL_${i}`).trim()||`COL_${i}`);const seen={};const final=headers.map(h=>{let k=h;seen[k]=(seen[k]||0)+1;if(seen[k]>1)k=`${k}_${seen[k]}`;return k;});return rows.slice(idx+1).filter(r=>r.some(c=>String(c||'').trim()!=='')).map(r=>{const obj={};final.forEach((h,i)=>obj[h]=r[i]??'');return obj;});}
async function parseFile(file,kind){const name=(file.name||'').toLowerCase();if((name.endsWith('.xlsx')||name.endsWith('.xls'))&&!/html|htm/.test(name)){if(!window.XLSX)throw new Error('No cargó la librería XLSX. Guarda el archivo como CSV o abre con internet.');const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',raw:false,cellDates:false});let best={score:-1,rows:null,sheet:''};for(const sn of wb.SheetNames){const ws=wb.Sheets[sn];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});for(let i=0;i<Math.min(rows.length,80);i++){const non=(rows[i]||[]).filter(c=>String(c||'').trim()).length;const score=non>1?headerScore(rows[i],kind):0;if(score>best.score)best={score,rows,sheet:sn,idx:i};}}if(!best.rows)return[];return rowsToObjects(best.rows,best.idx||0);}const text=await file.text();return parseDelimited(text,kind);}
function categoryMap(){const m=new Map();for(const r of state.categorias){if(r.producto)m.set(norm(r.producto),r.categoria||'Sin categoría');if(r.codigo)m.set(norm(r.codigo),r.categoria||'Sin categoría');}return m;}
function catOfSale(r,map){return r.categoria||map.get(norm(r.producto))||map.get(norm(r.codigoProducto))||'Sin categoría';}
function standardMetas(rows){return rows.map(r=>({vendedor:cleanVendor(pick(r,['Vendedor','Etiquetas de fila','ALMACEN AGRUPADO','Almacen agrupado','Agente','Vendedores'])),meta:parseNumber(pick(r,['Meta','Meta mínima','Meta minima','META MÍNIMA','META MINIMA','Monto','Objetivo']))})).filter(r=>r.vendedor&&r.meta>0);}
function standardCategorias(rows){return rows.map(r=>({codigo:String(pick(r,['CODIGO DE PRODUCTO','CodigoProducto','Código','Codigo','Articulo','Artículo'])).trim(),producto:String(pick(r,['DESCRIPCION DE PRODUCTO','Descripcion de producto','DESCRIPCIÓN DE PRODUCTO','Producto','Descripcion','Descripción','Articulo','Artículo'])).trim(),categoria:String(pick(r,['Categoria','Categoría','Category','Familia','Linea','Línea','Grupo'])).trim()||'Sin categoría'})).filter(r=>r.producto||r.codigo);}
function standardVentas(rows){const cmap=categoryMap();return rows.map(r=>{const product=String(pick(r,['DESCRIPCION_PRODUCTO','DESCRIPCION PRODUCTO','Descripción producto','Descripcion producto','Producto','Producto Nombre','ItemName'])).trim();const codigo=String(pick(r,['CODIGO DE PRODUCTO','CodigoProducto','Artículo','Articulo','ItemCode'])).trim();const year=pick(r,['Date - Año','Date Año','Año','Anio','Year']);const month=pick(r,['Date - Mes','Date Mes','Mes','Month']);const period=String(pick(r,['Periodo','Periodo activo'])).trim()||parseMonth(month,year)||parseMonth(pick(r,['Fecha','Date','DocDate','Fecha documento']));const vendor=cleanVendor(pick(r,['AGENTE_DE_VENTAS_CLIENTE','Agente de ventas cliente','ALMACEN AGRUPADO','Almacen agrupado','Vendedor','Agente']));const client=String(pick(r,['NOMBRE_SN','Nombre_SN','Cliente','Nombre Cliente','NOMBRE CLIENTE','CardName','Razón social','Razon social'])).trim();const directCat=String(pick(r,['Categoria','Categoría','Familia','Linea','Grupo','Category'])).trim();return {vendedor:vendor,cliente:client,codigoCliente:String(pick(r,['CODIGO DE SN','Codigo de SN','Código Cliente','Codigo cliente','CardCode'])).trim(),producto:product,codigoProducto:codigo,categoria:directCat||cmap.get(norm(product))||cmap.get(norm(codigo))||'',importe:parseNumber(pick(r,['Suma de SUBTOTAL','SUBTOTAL','Subtotal','Venta','VENTA MES','Importe','Total','Monto','Neto','LineTotal'])),piezas:parseNumber(pick(r,['Piezas','Cantidad','Qty','Unidades','Quantity'])),periodo:period,dia:String(pick(r,['Date - Día','Date Dia','Día','Dia'])).trim()};}).filter(r=>r.vendedor&&r.cliente&&(r.importe||r.producto));}
function standardVisitas(rows){return rows.map(r=>{const fecha=String(pick(r,['Fecha','Dia','Día','Date','day','fecha visita'])).trim();return {fecha,periodo:parseMonth(fecha)||parseMonth(pick(r,['Mes','Periodo'])),vendedor:cleanVendor(pick(r,['Vendedor','Nombre','Usuario','Agente','Vendor','agent'])),cliente:String(pick(r,['Cliente','Client','customer','Nombre cliente'])).trim(),tipo:String(pick(r,['Tipo','Type','Actividad','Motivo'])).trim(),ciudad:String(pick(r,['Ciudad','City','Zona'])).trim(),duracion:parseNumber(pick(r,['Duracion','Duración','duration_min','Duracion min','Tiempo']))};}).filter(r=>r.vendedor||r.cliente||r.fecha);}
function standardNoCobrado(rows){return rows.map(r=>({vendedor:cleanVendor(pick(r,['Vendedor','Agente','ALMACEN AGRUPADO','Almacen agrupado','Etiquetas de fila'])),deuda:parseNumber(pick(r,['Saldo','Deuda','No cobrado','NoCobrado','Importe','Monto','Vencido']))})).filter(r=>r.vendedor&&r.deuda!==0);}
function standardGiro(rows){const salesVendorByClient=new Map();for(const r of state.ventas){if(r.cliente&&r.vendedor&&!salesVendorByClient.has(norm(r.cliente)))salesVendorByClient.set(norm(r.cliente),r.vendedor);}return rows.map(r=>{const cliente=String(pick(r,['Cliente','CLIENTE','Nombre Cliente','CardName','NOMBRE_SN'])).trim();let vendedor=cleanVendor(pick(r,['Vendedor','Agente','ALMACEN AGRUPADO','Almacen agrupado','AGENTE_DE_VENTAS_CLIENTE']));if(!vendedor&&cliente)vendedor=salesVendorByClient.get(norm(cliente))||'';const year=pick(r,['Año','Anio','Year','Date - Año']);const month=pick(r,['Mes','Month','Date - Mes']);return {vendedor,codigo:String(pick(r,['CODIGO DE SN','Codigo de SN','Codigo Cliente','CardCode','Código','Codigo'])).trim(),cliente,giro:String(pick(r,['Giro','GIRO','Tipo Cliente','Segmento'])).trim()||'Sin giro',venta:parseNumber(pick(r,['SUBTOTAL','Subtotal','VENTA','Venta','Importe','Total','Monto','Venta $'])),periodo:parseMonth(month,year)||parseMonth(pick(r,['Fecha','Periodo','Date']))};}).filter(r=>r.cliente||r.giro||r.venta||r.vendedor);}
async function loadRows(kind, rows, source){let clean=[];if(kind==='metas')clean=standardMetas(rows);if(kind==='ventas')clean=standardVentas(rows);if(kind==='visitas')clean=standardVisitas(rows);if(kind==='categorias')clean=standardCategorias(rows);if(kind==='noCobrado')clean=standardNoCobrado(rows);if(kind==='giro')clean=standardGiro(rows);state[kind]=clean;state.raw[kind]={source,rows:rows.length,loaded:new Date().toISOString()};if(kind==='ventas'){const months=unique(clean.map(r=>r.periodo)).sort();if(months.length){state.config.period=months[months.length-1];state.config.monthLabel=monthLabel(state.config.period);}}await saveDataset(kind);renderAll();return clean.length;}
function vendors(){const list=[];state.metas.forEach(r=>list.push(r.vendedor));state.ventas.forEach(r=>list.push(r.vendedor));state.visitas.forEach(r=>list.push(r.vendedor));state.noCobrado.forEach(r=>list.push(r.vendedor));state.giro.forEach(r=>list.push(r.vendedor));const m=new Map();list.forEach(v=>{const cv=cleanVendor(v);const k=keyVendor(cv);if(k&&!EXCLUDED.has(k)&&!m.has(k))m.set(k,cv);});return [...m.values()].sort((a,b)=>a.localeCompare(b,'es'));}
function currentSalesRows(){const hasPeriod=state.ventas.some(r=>r.periodo);return state.ventas.filter(r=>!hasPeriod||r.periodo===state.config.period);}
function salesByVendor(){return groupSum(currentSalesRows(),r=>keyVendor(r.vendedor),r=>r.importe);}
function metasByVendor(){const m=new Map();state.metas.forEach(r=>{const k=keyVendor(r.vendedor);if(k)m.set(k,{vendedor:r.vendedor,meta:r.meta});});return m;}
function visitsByVendor(){const has=state.visitas.some(r=>r.periodo);const rows=state.visitas.filter(r=>!has||r.periodo===state.config.period);return groupSum(rows,r=>keyVendor(r.vendedor),r=>1);}
function debtByVendor(){return groupSum(state.noCobrado,r=>keyVendor(r.vendedor),r=>r.deuda);}
function metaRows(){const sm=salesByVendor(),mm=metasByVendor();const all=unique([...vendors(),...[...mm.values()].map(x=>x.vendedor)]);return all.map(v=>{const k=keyVendor(v),meta=(mm.get(k)||{}).meta||0,venta=sm.get(k)||0;return {'Vendedor':v,'Meta':meta,'Venta real':venta,'Avance %':meta?venta/meta*100:0,'Faltante en monto':Math.max(meta-venta,0)};}).sort((a,b)=>b['Avance %']-a['Avance %']);}
function visitRows(){const vm=visitsByVendor();const goal=(Number(state.config.visitWeeklyGoal)||25)*(Number(state.config.visitWeeks)||4);return vendors().map(v=>{const count=vm.get(keyVendor(v))||0;return {'Vendedor':v,'Visitas en el mes':count,'Avance %':goal?count/goal*100:0,'Meta mensual':goal};}).sort((a,b)=>b['Avance %']-a['Avance %']);}
function analysis(){const sig=[state.config.period,state.ventas.length,state.categorias.length].join('|');if(cache.sig===sig&&cache.data)return cache.data;const cmap=categoryMap(),period=state.config.period,prev=previousMonth(period);const catGroups=new Map(),clientGroups=new Map();for(const r of state.ventas){const cat=catOfSale(r,cmap);if(r.cliente&&cat){const k=[keyVendor(r.vendedor),norm(r.cliente),norm(cat)].join('||');if(!catGroups.has(k))catGroups.set(k,{vendedor:r.vendedor,cliente:r.cliente,categoria:cat,hist:0,curr:0,prev:0,months:new Set()});const g=catGroups.get(k);const val=Number(r.importe)||0;if(r.periodo===period)g.curr+=val;else if(r.periodo===prev){g.prev+=val;g.hist+=val;g.months.add(r.periodo);}else if(r.periodo&&r.periodo<period){g.hist+=val;g.months.add(r.periodo);}}
 if(r.cliente){const ck=norm(r.cliente);if(!clientGroups.has(ck))clientGroups.set(ck,{cliente:r.cliente,vendedor:r.vendedor,hist:0,prev:0,curr:0});const c=clientGroups.get(ck);const val=Number(r.importe)||0;if(r.periodo===period){c.curr+=val;if(r.vendedor)c.vendedor=r.vendedor;}else if(r.periodo===prev){c.prev+=val;c.hist+=val;}else if(r.periodo&&r.periodo<period)c.hist+=val;}}
 const recovery=[],placement=[],detail=[];catGroups.forEach(g=>{const avg=g.months.size?g.hist/g.months.size:g.hist;if(g.hist>0&&g.curr===0){const row={'Tipo':'Recuperación pendiente','Vendedor':g.vendedor,'Cliente':g.cliente,'Categoría':g.categoria,'Promedio histórico mensual':avg,'Oportunidad $':avg,'Venta actual':0,'Venta histórica':g.hist};recovery.push(row);detail.push(row);}if(g.hist===0&&g.curr>0){const row={'Tipo':'Colocación nueva','Vendedor':g.vendedor,'Cliente':g.cliente,'Categoría':g.categoria,'Promedio histórico mensual':0,'Oportunidad $':0,'Venta actual':g.curr,'Venta histórica':0};placement.push(row);detail.push(row);}});
 const recCat=mapToRows(groupSum(recovery,r=>r['Categoría'],r=>r['Oportunidad $']),'Categoría','Oportunidad $').map(r=>({...r,'Clientes':recovery.filter(x=>x['Categoría']===r['Categoría']).length}));addParticipation(recCat,'Oportunidad $');
 const placeCat=mapToRows(groupSum(placement,r=>r['Categoría'],r=>r['Venta actual']),'Categoría','Venta actual').map(r=>({...r,'Clientes':placement.filter(x=>x['Categoría']===r['Categoría']).length}));addParticipation(placeCat,'Venta actual');
 const recVend=mapToRows(groupSum(recovery,r=>r['Vendedor'],r=>r['Oportunidad $']),'Vendedor','Oportunidad $').map(r=>({...r,'Clientes/Categorías':recovery.filter(x=>x['Vendedor']===r['Vendedor']).length}));addParticipation(recVend,'Oportunidad $');
 const placeVend=mapToRows(groupSum(placement,r=>r['Vendedor'],r=>r['Venta actual']),'Vendedor','Venta actual').map(r=>({...r,'Clientes/Categorías':placement.filter(x=>x['Vendedor']===r['Vendedor']).length}));addParticipation(placeVend,'Venta actual');
 const recovered=[],prospects=[];clientGroups.forEach(g=>{if(g.curr>0&&g.hist>0&&g.prev===0)recovered.push({'Vendedor':g.vendedor,'Cliente':g.cliente,'Venta actual':g.curr,'Venta histórica':g.hist});if(g.curr>0&&g.hist===0)prospects.push({'Vendedor':g.vendedor,'Cliente':g.cliente,'Venta actual':g.curr});});
 const data={recovery,placement,detail:detail.sort((a,b)=>(b['Venta actual']+b['Oportunidad $'])-(a['Venta actual']+a['Oportunidad $'])),recCat:recCat.sort((a,b)=>b['Oportunidad $']-a['Oportunidad $']),placeCat:placeCat.sort((a,b)=>b['Venta actual']-a['Venta actual']),recVend:recVend.sort((a,b)=>b['Oportunidad $']-a['Oportunidad $']),placeVend:placeVend.sort((a,b)=>b['Venta actual']-a['Venta actual']),recovered:recovered.sort((a,b)=>b['Venta actual']-a['Venta actual']),prospects:prospects.sort((a,b)=>b['Venta actual']-a['Venta actual'])};cache={sig,data};return data;}
function categoryKpiByVendor(){return groupSum(analysis().placement,r=>keyVendor(r['Vendedor']),r=>r['Venta actual']);}

function dashboardRows(){const mr=metaRows(),vr=visitRows(),metaMap=new Map(mr.map(r=>[keyVendor(r.Vendedor),r])),visitMap=new Map(vr.map(r=>[keyVendor(r.Vendedor),r])),catMap=categoryKpiByVendor(),cliMap=clientKpiByVendor(),debt=debtByVendor();const maxCat=Math.max(...catMap.values(),0),maxCli=Math.max(...cliMap.values(),0),maxDebt=Math.max(...debt.values(),0);return vendors().map(v=>{const k=keyVendor(v),ventaPct=(metaMap.get(k)||{})['Avance %']||0,visitaPct=(visitMap.get(k)||{})['Avance %']||0,catMoney=catMap.get(k)||0,catPct=maxCat?catMoney/maxCat*100:0,cliCount=cliMap.get(k)||0,cliPct=maxCli?cliCount/maxCli*100:0,deuda=debt.get(k)||0,penalty=maxDebt?deuda/maxDebt*20:0,score=Math.max(0,(Math.min(ventaPct,120)+Math.min(visitaPct,120)+catPct+cliPct)/4-penalty);return {'#':0,'Vendedor':v,'Meta %':ventaPct,'Visitas %':visitaPct,'Colocación cat. $':catMoney,'Prospectos/recup.':cliCount,'Cartera vencida':deuda,'Score':score};}).sort((a,b)=>b.Score-a.Score).map((r,i)=>({...r,'#':i+1}));}

function giroData(){let rows=state.giro.slice();const hasPeriod=rows.some(r=>r.periodo);if(hasPeriod)rows=rows.filter(r=>!r.periodo||r.periodo===state.config.period);if(giroFilter!=='TODOS')rows=rows.filter(r=>r.vendedor===giroFilter);const total=rows.reduce((s,r)=>s+(Number(r.venta)||0),0);const resumen=mapToRows(groupSum(rows,r=>r.giro||'Sin giro',r=>r.venta),'Giro','Venta').map(r=>({...r,'Clientes':new Set(rows.filter(x=>(x.giro||'Sin giro')===r.Giro).map(x=>norm(x.cliente))).size}));addParticipation(resumen,'Venta');const vendedores=mapToRows(groupSum(rows,r=>r.vendedor||'Sin vendedor',r=>r.venta),'Vendedor','Venta').map(r=>({...r,'Clientes':new Set(rows.filter(x=>(x.vendedor||'Sin vendedor')===r.Vendedor).map(x=>norm(x.cliente))).size}));addParticipation(vendedores,'Venta');const detail=rows.map(r=>({'Vendedor':r.vendedor||'Sin vendedor','Código':r.codigo,'Cliente':r.cliente,'Giro':r.giro,'Venta $':r.venta,'% filtro':total?r.venta/total*100:0})).sort((a,b)=>b['Venta $']-a['Venta $']);return {total,resumen:resumen.sort((a,b)=>b.Venta-a.Venta),vendedores:vendedores.sort((a,b)=>b.Venta-a.Venta),detail};}
function viewHeader(title,sub){return `<div class="section-title"><div><h2>${title}</h2><p>${sub||''}</p></div></div>`;}
function renderTable(id,rows,cols,filename,opt={}){const el=document.getElementById(id);if(!el)return;const title=opt.title||'';const klass=opt.compact?'table-scroll compact':(opt.noX?'table-scroll no-x':'table-scroll');el.innerHTML=`<div class="toolbar"><h3>${title}</h3><div class="actions"><span class="badge">${rows.length} registros</span><button class="mini" data-export="${id}">CSV</button></div></div><div class="${klass}">${rows.length?`<table class="${opt.dashboard?'dashboard-table':''}"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>formatCell(r[c],c)).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">Sin datos. Carga el Excel correspondiente en Configuración.</div>'}</div>`;el.querySelector('[data-export]')?.addEventListener('click',()=>downloadCSV(filename||'tabla.csv',rows,cols));}
function formatCell(v,c){const nc=norm(c);let cls='';let out=v??'';if(nc.includes('META')||nc.includes('VENTA')||nc.includes('FALTANTE')||nc.includes('DEUDA')||nc.includes('CARTERA')||nc.includes('OPORTUNIDAD')||nc.includes('HISTORICA')||nc.includes('PROMEDIO')||nc.includes('COLOCACION')){cls='num';out=money2(v);}else if(nc.includes('%')||nc.includes('AVANCE')||nc.includes('PARTICIPACION')||nc==='SCORE'){cls='num';out=nc==='SCORE'?pct(v):pct(v);}else if(nc.includes('VISITAS')||nc.includes('CLIENTES')||nc.includes('PROSPECTOS')||nc==='#'){cls='num';out=num(v);}return `<td class="${cls}">${out}</td>`;}
function renderDashboard(){const rows=dashboardRows();const totalVenta=currentSalesRows().reduce((s,r)=>s+(Number(r.importe)||0),0);const totalMeta=state.metas.reduce((s,r)=>s+(Number(r.meta)||0),0);const a=analysis();document.getElementById('dashboard').innerHTML=viewHeader('Dashboard','Ranking general de vendedores por KPIs. La tabla está compacta para verse completa sin scroll lateral.')+`<div class="grid"><div class="card"><h3>Venta periodo</h3><div class="kpi">${money(totalVenta)}</div><p>${pct(totalMeta?totalVenta/totalMeta*100:0)} de la meta global</p></div><div class="card"><h3>Visitas cargadas</h3><div class="kpi">${num(state.visitas.length)}</div><p>Meta mensual: ${num((Number(state.config.visitWeeklyGoal)||25)*(Number(state.config.visitWeeks)||4))} por vendedor</p></div><div class="card"><h3>Colocación categoría</h3><div class="kpi positive">${money(a.placement.reduce((s,r)=>s+r['Venta actual'],0))}</div><p>Categorías que el cliente no compraba y ahora sí compra</p></div><div class="card"><h3>Cartera vencida</h3><div class="kpi negative">${money(carteraRows().reduce((s,r)=>s+r.Deuda,0))}</div><p>No cobrado cargado del mes vencido</p></div></div><div class="tablebox" id="dashTable"></div>`;renderTable('dashTable',rows,['#','Vendedor','Meta %','Visitas %','Colocación cat. $','Prospectos/recup.','Cartera vencida','Score'],'dashboard_ranking.csv',{title:'Tabulador de ranking',dashboard:true,noX:true});}

function renderVisitas(){const has=state.visitas.some(r=>r.periodo);const detail=state.visitas.filter(r=>!has||r.periodo===state.config.period).map(r=>({'Fecha':r.fecha,'Vendedor':r.vendedor,'Cliente':r.cliente,'Tipo':r.tipo,'Ciudad':r.ciudad,'Duración min':r.duracion}));document.getElementById('visitas').innerHTML=viewHeader('Visita de clientes','Meta: 25 clientes por semana. El detalle conserva el formato del Excel de visitas.')+`<div class="tablebox" id="vis1"></div><div class="tablebox" id="vis2"></div>`;renderTable('vis1',visitRows(),['Vendedor','Visitas en el mes','Avance %','Meta mensual'],'visitas_resumen.csv',{title:'Primera tabla · Resumen de visitas'});renderTable('vis2',detail,['Fecha','Vendedor','Cliente','Tipo','Ciudad','Duración min'],'visitas_detalle.csv',{title:'Segunda tabla · Detalle de visitas cargadas'});}
function renderCategorias(){const a=analysis();document.getElementById('categorias').innerHTML=viewHeader('Incremento y recuperación de Categoría','Usa Categorias.xlsx para enlazar producto → categoría y data(1).xlsx para comparar mes actual contra meses anteriores.')+`<div class="grid two"><div class="tablebox" id="cat1"></div><div class="tablebox" id="cat2"></div></div><div class="grid two"><div class="tablebox" id="cat3"></div><div class="tablebox" id="cat4"></div></div><div class="tablebox" id="cat5"></div>`;renderTable('cat1',a.recCat,['Categoría','Clientes','Oportunidad $','Participación %'],'recuperacion_categoria_global.csv',{title:'Tabla 1 · Recuperación por categoría global'});renderTable('cat2',a.placeCat,['Categoría','Clientes','Venta actual','Participación %'],'colocacion_categoria_global.csv',{title:'Tabla 2 · Colocación de categoría'});renderTable('cat3',a.recVend,['Vendedor','Clientes/Categorías','Oportunidad $','Participación %'],'recuperacion_categoria_vendedor.csv',{title:'Tabla 3 · Recuperación por vendedor'});renderTable('cat4',a.placeVend,['Vendedor','Clientes/Categorías','Venta actual','Participación %'],'colocacion_categoria_vendedor.csv',{title:'Tabla 4 · Colocación por vendedor'});renderTable('cat5',a.detail,['Tipo','Vendedor','Cliente','Categoría','Promedio histórico mensual','Oportunidad $','Venta actual','Venta histórica'],'detalle_incremento_recuperacion_categoria.csv',{title:'Tabla 5 · Detalle completo'});}
function renderProspectos(){const a=analysis();document.getElementById('prospectos').innerHTML=viewHeader('Prospección y recuperación de clientes','Clientes recuperados: tenían historial, no compraron el mes anterior y vuelven en el periodo activo. Prospectos: clientes con compra actual sin historial previo en ventas.')+`<div class="grid two"><div class="tablebox" id="pro1"></div><div class="tablebox" id="pro2"></div></div>`;renderTable('pro1',a.recovered,['Vendedor','Cliente','Venta actual','Venta histórica'],'clientes_recuperados.csv',{title:'Tabla 1 · Clientes recuperados'});renderTable('pro2',a.prospects,['Vendedor','Cliente','Venta actual'],'prospectos_nuevos.csv',{title:'Tabla 2 · Prospectos nuevos'});}
function renderCartera(){document.getElementById('cartera').innerHTML=viewHeader('Cartera Vencida','Se alimenta con el Excel no cobrado del mes vencido. Tabla fija: Vendedor y Deuda.')+`<div class="tablebox" id="carteraTable"></div>`;renderTable('carteraTable',carteraRows(),['Vendedor','Deuda'],'cartera_vencida.csv',{title:'No cobrado por vendedor'});}
function renderGiro(){const data=giroData();const options=unique(state.giro.map(r=>r.vendedor)).sort((a,b)=>a.localeCompare(b,'es'));document.getElementById('giro').innerHTML=viewHeader('Giro de Clientes','Información estratégica adicional. Se alimenta con el Excel giro y permite filtrar por vendedor.')+`<div class="filters"><label>Filtrar vendedor</label><select id="giroFilter"><option value="TODOS">Todos los vendedores</option>${options.map(v=>`<option value="${v}" ${giroFilter===v?'selected':''}>${v}</option>`).join('')}</select><span class="badge">Venta filtro: ${money(data.total)}</span></div><div class="grid two"><div class="tablebox" id="giro1"></div><div class="tablebox" id="giro2"></div></div><div class="tablebox" id="giro3"></div>`;document.getElementById('giroFilter').onchange=e=>{giroFilter=e.target.value;renderGiro();};renderTable('giro1',data.resumen,['Giro','Clientes','Venta','Participación %'],'giro_resumen.csv',{title:'Venta y participación por giro'});renderTable('giro2',data.vendedores,['Vendedor','Clientes','Venta','Participación %'],'giro_por_vendedor.csv',{title:'Relación por vendedor'});renderTable('giro3',data.detail,['Vendedor','Código','Cliente','Giro','Venta $','% filtro'],'giro_detalle.csv',{title:'Detalle cliente / giro / vendedor'});}
function renderConfig(){document.getElementById('config').innerHTML=viewHeader('Configuración','Carga aquí cada Excel que alimenta los KPIs. Las páginas de KPIs quedan sólo para revisar y exportar.')+`<div class="notice ok">Estructura corregida: data(1).xlsx se carga en Ventas histórico / actual; Categorias.xlsx se carga en Catálogo de categorías. La app detecta encabezados aunque el Excel tenga renglones de filtros arriba o la información esté en otra hoja.</div><div class="card"><h3>Periodo y reglas</h3><div class="row"><div class="field"><label>Periodo activo</label><input id="cfgPeriod" type="month" value="${state.config.period}"></div><div class="field"><label>Nombre del reporte</label><input id="cfgMonthLabel" value="${state.config.monthLabel}"></div><div class="field"><label>Meta semanal visitas</label><input id="cfgWeekly" type="number" min="1" step="1" value="${state.config.visitWeeklyGoal}"></div><div class="field"><label>Semanas para visitas</label><input id="cfgWeeks" type="number" min="1" step="1" value="${state.config.visitWeeks}"></div></div><div class="actions"><button class="mini primary" id="saveCfg">Guardar configuración</button><button class="mini" id="loadIncluded">Cargar CSV incluidos del ZIP</button><button class="mini" id="resetAll">Borrar cargas</button></div></div><div class="config-grid">${IMPORTS.map(cardHtml).join('')}</div>`;document.getElementById('saveCfg').onclick=()=>{state.config.period=document.getElementById('cfgPeriod').value||state.config.period;state.config.monthLabel=document.getElementById('cfgMonthLabel').value||monthLabel(state.config.period);state.config.visitWeeklyGoal=parseNumber(document.getElementById('cfgWeekly').value)||25;state.config.visitWeeks=parseNumber(document.getElementById('cfgWeeks').value)||4;state.updatedAt=new Date().toISOString();saveConfig();cache.sig='';renderAll();};document.getElementById('resetAll').onclick=resetAll;document.getElementById('loadIncluded').onclick=loadIncludedFiles;IMPORTS.forEach(it=>{const file=document.getElementById(`file_${it.kind}`),paste=document.getElementById(`paste_${it.kind}`);file.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=await parseFile(f,it.kind);const count=await loadRows(it.kind,rows,f.name);alert(`Carga lista: ${count} registros en ${it.title}`);}catch(err){console.error(err);alert('No pude procesar el archivo. Revisa encabezados o guárdalo como CSV.');}};document.getElementById(`btn_${it.kind}`).onclick=async()=>{const count=await loadRows(it.kind,parseDelimited(paste.value,it.kind),'texto pegado');alert(`Carga lista: ${count} registros.`);};document.getElementById(`clear_${it.kind}`).onclick=()=>clearDataset(it.kind);});}
function cardHtml(it){const count=(state[it.kind]||[]).length;return `<div class="config-card"><h3>${it.title}</h3><div class="help">${it.desc}</div><input id="file_${it.kind}" type="file" accept=".xlsx,.xls,.csv,.txt,.tsv"><textarea class="paste" id="paste_${it.kind}" placeholder="También puedes pegar aquí la tabla desde Excel..."></textarea><div class="actions" style="margin-top:8px"><button class="mini primary" id="btn_${it.kind}">Importar texto</button><button class="mini" onclick="downloadTemplate('${it.template}')">Descargar plantilla</button><button class="mini" id="clear_${it.kind}">Limpiar</button></div><div class="status">Registros cargados: <b>${count.toLocaleString('es-MX')}</b></div></div>`;}
async function loadIncludedFiles(){try{const cat=await fetch('archivos_base/categorias.csv').then(r=>{if(!r.ok)throw new Error('cat');return r.text();});await loadRows('categorias',parseDelimited(cat,'categorias'),'archivos_base/categorias.csv');const ven=await fetch('archivos_base/ventas_data_1.csv').then(r=>{if(!r.ok)throw new Error('ventas');return r.text();});await loadRows('ventas',parseDelimited(ven,'ventas'),'archivos_base/ventas_data_1.csv');alert('Listo: se cargaron los CSV incluidos. Si abriste el HTML directo y no funcionó, carga los CSV manualmente desde esta pantalla.');}catch(e){alert('No se pudieron cargar automáticamente los CSV incluidos. Si abriste index.html directo desde tu PC, usa los botones Elegir archivo y carga los CSV de la carpeta archivos_base.');}}
window.downloadTemplate=function(filename){const templates={'plantilla_metas.csv':['Vendedor,Meta',...DEFAULT_METAS.map(r=>`${csvEscape(r.vendedor)},${r.meta}`)].join('\n'),'plantilla_ventas.csv':'AGENTE_DE_VENTAS_CLIENTE,NOMBRE_SN,DESCRIPCION_PRODUCTO,Suma de SUBTOTAL,Date - Año,Date - Mes,Date - Día\nGDL6 - DANIEL  AGUILAR,CLIENTE EJEMPLO,PRODUCTO EJEMPLO,1500,2026,julio,1','plantilla_visitas.csv':'Fecha,Vendedor,Cliente,Tipo,Ciudad,DuracionMin\n2026-07-01,GDL6 - DANIEL  AGUILAR,CLIENTE EJEMPLO,Seguimiento,GDL,25','plantilla_categorias.csv':'CODIGO DE PRODUCTO,DESCRIPCION DE PRODUCTO,Categoria\nSE-000,PRODUCTO EJEMPLO,SALSA DE SOYA','plantilla_no_cobrado.csv':'Vendedor,Saldo\nGDL6 - DANIEL  AGUILAR,828.00','plantilla_giro.csv':'Vendedor,Cliente,Giro,Venta\nGDL6 - DANIEL  AGUILAR,CLIENTE EJEMPLO,Restaurante,1500'};const blob=new Blob(['\uFEFF'+(templates[filename]||'')],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);};
function renderNav(){document.getElementById('nav').innerHTML=TABS.map(([id,label])=>`<button class="navbtn ${id===currentTab?'active':''}" data-tab="${id}">${label}</button>`).join('');document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;showTab(currentTab);});}
function showTab(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));}
function renderChips(){document.getElementById('chipPeriod').textContent='Periodo: '+(state.config.monthLabel||monthLabel(state.config.period));document.getElementById('chipRows').textContent=`Ventas: ${(state.ventas.length||0).toLocaleString('es-MX')} · Categorías: ${(state.categorias.length||0).toLocaleString('es-MX')}`;document.getElementById('chipUpdated').textContent=state.updatedAt?'Actualizado: '+new Date(state.updatedAt).toLocaleString('es-MX'):'Sin carga';}
function renderAll(){renderNav();renderChips();renderDashboard();renderMetas();renderVisitas();renderCategorias();renderProspectos();renderCartera();renderGiro();renderConfig();showTab(currentTab);}
init();
})();
</script>
